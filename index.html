<!doctype html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Oxu</title>
<style>
:root{--bg:#eef1ec;--panel:#fff;--ink:#1b2420;--mute:#6b7771;--line:#d3dad4;--acc:#1f6f5c;--mark:#f2c14e;--serif:Charter,'Iowan Old Style','Palatino Linotype',Georgia,serif}
body.dark{--bg:#14181a;--panel:#1d2326;--ink:#e4ebe5;--mute:#8d9a93;--line:#2c353a;--acc:#5fc2a5}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font:600 16px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--panel);border-color:var(--line)}button:focus-visible,select:focus-visible{outline:2px solid var(--acc)}
.fill{background:var(--acc);color:#fff;border-color:var(--acc)}.fill:hover{background:var(--acc);opacity:.9}
main{flex:1;min-height:0;position:relative}
section{position:absolute;inset:0;overflow:auto}[hidden]{display:none!important}
#lib{padding:20px;max-width:760px;margin:auto}
#lib h2{font:600 28px var(--serif);margin:8px 0 4px}#lib p{color:var(--mute);margin:0 0 18px}
.book{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.book .t{flex:1;min-width:0;font:17px var(--serif)}.book .nm{cursor:pointer;overflow-wrap:anywhere;word-break:break-word;line-height:1.3}.book>button{flex:none}.book>.ext{flex:none;margin-top:3px}.book small{display:block;color:var(--mute);font:12px system-ui}
.book .act{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:13px system-ui;color:var(--mute)}.book .act button{border-color:var(--line);font-size:13px;padding:4px 9px}.book .act button:disabled{opacity:.4}
.ext{font:600 11px system-ui;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--mute)}
#reader{display:flex;flex-direction:column}
#stage{flex:1;min-height:0;position:relative}
#epubView{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
.ebody{max-width:700px;margin:0 auto;padding:24px 18px 90px;font:20px/1.7 var(--serif);overflow-wrap:break-word}
.ebody p{margin:0 0 .9em}.ebody h1,.ebody h2,.ebody h3{line-height:1.25}.ebody img,.ebody svg{max-width:100%;height:auto}.ebody a{color:inherit;text-decoration:none}
#pdfView,#txtView{position:absolute;inset:0;overflow:auto}
#epubView,#pdfView,#txtView{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#txtView p{margin:0 0 .8em}
#txtView{white-space:pre-wrap;font:20px/1.7 var(--serif);padding:24px max(16px,calc(50% - 360px))}
.pg{position:relative;margin:8px auto;background:#fff;box-shadow:0 1px 8px #0003}
body.dark .pg canvas{filter:invert(.9) hue-rotate(180deg)}
.textLayer{position:absolute;inset:0;line-height:1}.textLayer span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0}
.textLayer ::selection{background:#f2c14e88}
#bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px;border-top:1px solid var(--line);color:var(--mute);font-size:13px}
#pop{position:fixed;z-index:9;width:min(340px,calc(100vw - 16px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--mark);border-radius:10px;box-shadow:0 8px 28px #0004;padding:10px 12px}
#pw{font:600 15px var(--serif);color:var(--mute);max-height:64px;overflow:auto}
#pt{font:19px/1.35 var(--serif);margin:4px 0 8px;max-height:36vh;overflow:auto}
#pm{font-size:13px;color:var(--mute);white-space:pre-line;margin:-2px 0 8px;max-height:20vh;overflow:auto}#pm:empty{display:none}
#pa{display:flex;gap:4px}#pa button{border-color:var(--line);padding:5px 9px}
#dict{padding:16px;max-width:760px;margin:auto}
.row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.row div{flex:1}.row b{font:600 18px var(--serif)}.row i{display:block;color:var(--mute);font-size:13px;margin-top:2px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:min(320px,90vw)}
dialog label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}dialog select{width:100%;border-color:var(--line);background:var(--panel)}
.empty{color:var(--mute);padding:24px 0}
</style></head><body>
<header>
 <button id="bBack" title="Kitabxana">☰</button><h1 id="title">Oxu</h1>
 <button id="bMinus" title="Kiçilt">A−</button><button id="bPlus" title="Böyüt">A+</button>
 <button id="bTheme" title="Tünd/açıq">◐</button><button id="bDict" title="Lüğətim">★ <span id="cnt">0</span></button><button id="bSet" title="Tərcümə dilləri">⚙</button>
</header>
<main>
 <section id="lib"><h2>Kitabxana</h2><p>PDF, EPUB və TXT faylları. Kitablar yalnız bu cihazda saxlanılır.</p>
  <button class="fill" id="bAdd">+ Kitab əlavə et</button><input type="file" id="file" accept=".pdf,.epub,.txt" multiple hidden>
  <div id="books"></div></section>
 <section id="reader" hidden><div id="stage"><div id="epubView" hidden></div><div id="pdfView" hidden></div><div id="txtView" hidden></div></div>
  <div id="bar"><button id="bPrev">‹ Əvvəlki</button><span id="prog"></span><button id="bNext">Növbəti ›</button></div></section>
 <section id="dict" hidden></section>
</main>
<div id="pop" hidden><div id="pw"></div><div id="pt"></div><div id="pm"></div><div id="pa"><button id="pStar" class="fill">☆ Lüğətə əlavə et</button><button id="pSay" title="Səsləndir">🔊</button><button id="pX">✕</button></div></div>
<dialog id="dlg"><b>Tərcümə dilləri</b><label>Oxuduğum dil</label><select id="sSrc"></select><label>Tərcümə olunacaq dil</label><select id="sDst"></select><p style="text-align:right;margin:16px 0 0"><button class="fill" id="sOk">Yadda saxla</button></p></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let cfg=Object.assign({src:'Autodetect',dst:'az',size:110,dark:false},LS('cfg',{}));
let dict=LS('dict',[]);
const LANGS=[['Autodetect','Avtomatik'],['en','English'],['tr','Türkçe'],['ru','Русский'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['ar','العربية'],['az','Azərbaycanca']];
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- storage (IndexedDB) ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('oxu',2);r.onupgradeneeded=()=>{const d=r.result;for(const n of ['books','packs'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f,st='books')=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(st,m);const o=f(t.objectStore(st));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)})};
const packIdx={};
async function loadPacks(){try{(await tx('readonly',x=>x.getAll(),'packs')).forEach(p=>packIdx[p.id]=p)}catch{}}

/* ---------- views ---------- */
function view(n){['lib','reader','dict'].forEach(v=>$('#'+v).hidden=v!==n);hidePop();if(n!=='reader')$('#title').textContent='Oxu'}
async function renderLib(){
 const list=(await tx('readonly',s=>s.getAll())).sort((a,b)=>b.added-a.added);
 $('#books').innerHTML=list.length?'':'<div class="empty">Hələ kitab yoxdur. Yuxarıdakı düymə ilə fayl seç.</div>';
 list.forEach(b=>{const pk=packIdx[b.id],d=document.createElement('div');d.className='book';
  d.innerHTML=`<span class="ext">${b.type.toUpperCase()}</span><div class="t"><div class="nm">${esc(b.name)}</div><small>${(b.blob.size/1048576).toFixed(1)} MB${pk?' · Oflayn: '+pk.n+' söz ('+(pk.src==='Autodetect'?'avto':pk.src)+'→'+pk.dst+')'+(pk.partial?' · natamam':''):''}</small><div class="act"></div></div><button title="Kitabı sil">🗑</button>`;
  d.querySelector('.nm').onclick=()=>openBook(b);
  const act=d.querySelector('.act'),btn=(t,f,dis)=>{const x=document.createElement('button');x.textContent=t;x.onclick=f;x.disabled=!!dis;act.append(x)};
  if(job&&job.id===b.id){const sp=document.createElement('span');sp.className='jp';sp.textContent=job.txt;act.append(sp,' ');btn('Dayandır',()=>{job.stop=true})}
  else{if(pk)btn('Oflayn sözləri sil',async()=>{await tx('readwrite',s=>s.delete(b.id),'packs');delete packIdx[b.id];renderLib()});
   btn(pk?'Yenilə':'⬇ Oflayn üçün hazırla',()=>makePack(b),!!job)}
  d.querySelector(':scope>button').onclick=async()=>{if(confirm('Kitab silinsin? (Lüğətin silinmir)')){await tx('readwrite',s=>s.delete(b.id));await tx('readwrite',s=>s.delete(b.id),'packs');delete packIdx[b.id];renderLib()}};
  $('#books').append(d)});
}
/* ---------- oflayn söz paketi (kitab başına) ---------- */
let job=null;
const upd=()=>{const e=document.querySelector('.jp');if(e&&job)e.textContent=job.txt};
async function readBook(b,add,prog){
 if(b.type==='txt'){add(await b.blob.text());return}
 if(b.type==='pdf'){const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;
  for(let i=1;i<=d.numPages&&!job.stop;i++){const t=await(await d.getPage(i)).getTextContent();add(t.items.map(x=>x.str).join(' '));prog(i+'/'+d.numPages)}return}
 await needEpub();const bk=ePub(await b.blob.arrayBuffer(),{openAs:'binary'});await bk.ready;let i=0;
 for(const sc of bk.spine.spineItems){if(job.stop)break;
  try{const c=await sc.load(bk.load.bind(bk));c.querySelectorAll('style,script').forEach(e=>e.remove());add(c.textContent||'');sc.unload&&sc.unload()}catch{}
  prog(++i+'/'+bk.spine.spineItems.length)}
 try{bk.destroy()}catch{}
}
async function trBatch(ws,src,dst){
 const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+(src==='Autodetect'?'auto':src)+'&tl='+dst+'&q='+encodeURIComponent(ws.join('\n')));
 if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json(),T=(j[0]||[]).map(x=>x[0]).join('').split('\n').map(x=>x.trim());
 while(T.length&&!T[T.length-1])T.pop();
 if(T.length!==ws.length){
  if(ws.length===1)return T[0]?{[ws[0]]:T[0]}:{};
  const h=ws.length>>1;return Object.assign(await trBatch(ws.slice(0,h),src,dst),await trBatch(ws.slice(h),src,dst))}
 const o={};ws.forEach((w,i)=>{if(T[i])o[w]=T[i]});return o;
}
async function makePack(b){
 if(job)return;const src=cfg.src,dst=cfg.dst;
 if(src===dst){alert('Mənbə və tərcümə dili eyni ola bilməz (⚙).');return}
 job={id:b.id,txt:'Mətn oxunur…',stop:false};renderLib();
 let fail=null;
 try{
  const cnt=new Map();
  await readBook(b,t=>{for(const m of t.matchAll(WRE)){const w=m[0].toLowerCase();if(w.length>1&&w.length<31)cnt.set(w,(cnt.get(w)||0)+1)}},x=>{job.txt='Mətn oxunur… '+x;upd()});
  const words=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,15000),batches=[];
  for(let i=0;i<words.length;){let n=0,len=0;while(i+n<words.length&&n<250&&len+words[i+n].length+1<1300){len+=words[i+n].length+1;n++}batches.push(words.slice(i,i+n));i+=n}
  const map={};let bi=0,done=0;
  const worker=async()=>{while(bi<batches.length&&!job.stop&&!fail){const bt=batches[bi++];
   try{Object.assign(map,await trBatch(bt,src,dst))}catch(e){fail=e}
   done+=bt.length;job.txt='Tərcümə olunur… '+Math.round(done/words.length*100)+'% ('+Object.keys(map).length+' söz)';upd()}};
  await Promise.all([worker(),worker(),worker()]);
  const n=Object.keys(map).length;
  if(n){const p={id:b.id,name:b.name,src,dst,n,date:Date.now(),map,partial:!!(fail||job.stop)};await tx('readwrite',x=>x.put(p),'packs');packIdx[b.id]=p}
  else if(fail)alert('Alınmadı. İnternet bağlantısını yoxla və yenidən cəhd et.');
 }catch(e){alert('Xəta: '+(e.message||e))}
 job=null;renderLib();
}
function packLookup(text){
 if(/\s/.test(text))return null;const w=text.toLowerCase();
 for(const p of Object.values(packIdx))if(p.dst===cfg.dst&&(p.src===cfg.src||p.src==='Autodetect'||cfg.src==='Autodetect')&&p.map[w])return p.map[w];
 return null}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#bAdd').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
 for(const f of e.target.files){const ext=f.name.split('.').pop().toLowerCase();if(!['pdf','epub','txt'].includes(ext))continue;
  await tx('readwrite',s=>s.put({id:Date.now()+Math.random().toString(36).slice(2),name:f.name.replace(/\.\w+$/,''),type:ext,blob:f,added:Date.now()}))}
 e.target.value='';renderLib()};
$('#bBack').onclick=()=>{cleanup();view('lib');renderLib()};

/* ---------- reader ---------- */
let cur,rend,pdf,pg=1;
function cleanup(){try{book&&book.destroy()}catch{}book=null;secs=[];pdf=null;['epubView','pdfView','txtView'].forEach(i=>{$('#'+i).innerHTML='';$('#'+i).hidden=true})}
async function openBook(b){
 cleanup();cur=b;view('reader');$('#title').textContent=b.name;$('#prog').textContent='';
 const el=$({epub:'#epubView',pdf:'#pdfView',txt:'#txtView'}[b.type]);el.hidden=false;
 try{
  if(b.type==='epub')await openEpub(b);
  else if(b.type==='pdf'){pdf=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;pg=LS('pos:'+b.id,1);await renderPdf()}
  else{el.innerHTML=(await b.blob.text()).split(/\r?\n/).filter(l=>l.trim()).map(l=>'<p>'+esc(l)+'</p>').join('');el.style.fontSize=cfg.size/110*20+'px';el.scrollTop=LS('pos:'+b.id,0);el.onscroll=()=>SV('pos:'+b.id,el.scrollTop)}
 }catch(e){$('#prog').textContent='Fayl açılmadı: '+e.message}
}
/* ---------- kitabxanaları ehtiyatla yüklə (EPUB üçün) ---------- */
function loadScript(urls){return urls.reduce((p,u)=>p.catch(()=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=u;e.onload=res;e.onerror=()=>rej(new Error('Yüklənmədi: '+u));document.head.append(e)})),Promise.reject())}
async function needEpub(){
 if(window.ePub)return;
 if(!window.JSZip)await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js']);
 await loadScript(['https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.93/epub.min.js','https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js']);
 if(!window.ePub)throw new Error('epub.js yüklənmədi. İnterneti yoxla.');
}
async function openEpub(b){
 await needEpub();
 book=ePub(await b.blob.arrayBuffer(),{openAs:'binary',replacements:'blobUrl'});
 await book.ready;
 secs=book.spine.spineItems.filter(x=>x.linear!=='no'&&x.linear!==false);
 if(!secs.length)secs=book.spine.spineItems;
 const v=$('#epubView');v.onscroll=()=>{clearTimeout(sT);sT=setTimeout(()=>{SV('pos:'+cur.id,{i:ci,y:v.scrollTop});progE()},300);hidePop()};
 const pos=LS('pos:'+b.id,null);
 await loadSec(pos&&typeof pos==='object'?pos.i:0,pos&&typeof pos==='object'?pos.y:0);
}
let book,secs=[],ci=0,sT;
async function loadSec(i,y=0){
 if(i<0||i>=secs.length)return;ci=i;hidePop();
 const v=$('#epubView');v.innerHTML='<div class="ebody">Yüklənir…</div>';
 let html;try{html=await secs[i].render(book.load.bind(book))}catch(e){v.innerHTML='<div class="ebody">Fəsil açılmadı: '+esc(e.message||String(e))+'</div>';return}
 const d=new DOMParser().parseFromString(html,'text/html');
 d.querySelectorAll('script,style,link,meta,title').forEach(n=>n.remove());
 d.querySelectorAll('[style]').forEach(n=>n.removeAttribute('style'));
 const box=document.createElement('div');box.className='ebody';box.innerHTML=d.body?d.body.innerHTML:'';
 box.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
 v.innerHTML='';v.append(box);themeEpub();
 v.scrollTop=y==='end'?v.scrollHeight:y;progE();SV('pos:'+cur.id,{i:ci,y:v.scrollTop});
}
function progE(){const v=$('#epubView'),m=Math.max(1,v.scrollHeight-v.clientHeight);$('#prog').textContent='Fəsil '+(ci+1)+'/'+secs.length+' · '+Math.round((ci+Math.min(1,v.scrollTop/m))/secs.length*100)+'%'}
function themeEpub(){const b=document.querySelector('.ebody');if(b)b.style.fontSize=cfg.size/110*20+'px'}
function stepEpub(dir){const v=$('#epubView'),h=v.clientHeight*.9;
 if(dir>0){if(v.scrollTop+v.clientHeight<v.scrollHeight-6)v.scrollBy({top:h,behavior:'smooth'});else loadSec(ci+1)}
 else{if(v.scrollTop>6)v.scrollBy({top:-h,behavior:'smooth'});else loadSec(ci-1,'end')}}
async function renderPdf(){
 hidePop();const v=$('#pdfView');v.innerHTML='';const page=await pdf.getPage(pg);
 const base=page.getViewport({scale:1}),scale=Math.min((v.clientWidth-16)/base.width,2.4)*cfg.size/110,vp=page.getViewport({scale}),dpr=devicePixelRatio||1;
 const w=document.createElement('div');w.className='pg';w.style.width=vp.width+'px';w.style.height=vp.height+'px';
 const cv=document.createElement('canvas');cv.width=vp.width*dpr;cv.height=vp.height*dpr;cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
 const tl=document.createElement('div');tl.className='textLayer';w.append(cv,tl);v.append(w);v.scrollTop=0;
 $('#prog').textContent=pg+' / '+pdf.numPages;SV('pos:'+cur.id,pg);
 await page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
 pdfjsLib.renderTextLayer({textContentSource:await page.getTextContent(),container:tl,viewport:vp,textDivs:[]});
}
const go=n=>{if(pdf&&pg+n>=1&&pg+n<=pdf.numPages){pg+=n;renderPdf()}};
const next=()=>cur&&(cur.type==='epub'?stepEpub(1):go(1)),prev=()=>cur&&(cur.type==='epub'?stepEpub(-1):go(-1));
$('#bNext').onclick=next;$('#bPrev').onclick=prev;
const keyNav=e=>{if(e.key==='ArrowRight'||e.key==='PageDown')next();if(e.key==='ArrowLeft'||e.key==='PageUp')prev()};
document.addEventListener('keydown',keyNav);
function applySize(){if(!cur)return;if(cur.type==='epub')themeEpub();else if(cur.type==='pdf')renderPdf();else $('#txtView').style.fontSize=cfg.size/110*20+'px'}
$('#bPlus').onclick=()=>{cfg.size=Math.min(220,cfg.size+10);SV('cfg',cfg);applySize()};
$('#bMinus').onclick=()=>{cfg.size=Math.max(70,cfg.size-10);SV('cfg',cfg);applySize()};
function applyTheme(){document.body.classList.toggle('dark',cfg.dark);document.querySelector('meta[name=theme-color]').content=cfg.dark?'#14181a':'#eef1ec';themeEpub()}
$('#bTheme').onclick=()=>{cfg.dark=!cfg.dark;SV('cfg',cfg);applyTheme()};

/* ---------- tap / selection -> translate ---------- */
function bind(target,d,fr,swipe){
 let p;
 target.addEventListener('pointerdown',e=>{p=[e.clientX,e.clientY]});
 target.addEventListener('pointerup',e=>{if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p=null;
  if(Math.hypot(dx,dy)<10)setTimeout(()=>{try{tap(e)}catch(x){dbg('Xəta: '+x.message)}},20);
  else if(swipe&&Math.abs(dx)>70&&Math.abs(dy)<50)dx<0?next():prev()});
}
let dbgT;function dbg(m){const el=$('#prog'),old=el.dataset.o??el.textContent;el.dataset.o=old;el.textContent=m;clearTimeout(dbgT);dbgT=setTimeout(()=>{el.textContent=el.dataset.o;delete el.dataset.o},2500)}
/* Öz seçim sistemi: iPhone-un menyusu çıxmasın deyə mətn "user-select:none"-dur, sözləri özümüz tapırıq */
const WRE=/[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu;
let S=null;
const cs=e=>getComputedStyle(e).display;
function build(unit,pdf){
 if(unit._b)return unit._b;
 const segs=[];let text='';
 if(pdf){
  const items=[...unit.children].filter(e=>e.firstChild&&e.firstChild.nodeType===3).map(e=>({e,b:e.getBoundingClientRect()})),lines=[];
  for(const o of items){const cy=(o.b.top+o.b.bottom)/2,L=lines.find(l=>Math.abs(cy-l.cy)<Math.max(o.b.height,l.h)*.45);
   if(L)L.it.push(o);else lines.push({cy,h:o.b.height,it:[o]})}
  for(const L of lines){L.it.sort((a,b)=>a.b.left-b.b.left);if(text&&!/\s$/.test(text))text+=' ';let prev=null;
   for(const o of L.it){const t=o.e.textContent;
    if(prev&&o.b.left-prev.b.right>L.h*.2&&!/\s$/.test(text)&&!/^\s/.test(t))text+=' ';
    segs.push({node:o.e.firstChild,start:text.length,len:t.length});text+=t;prev=o}}
 }else{
  const walk=n=>{for(const c of n.childNodes){
   if(c.nodeType===3){segs.push({node:c,start:text.length,len:c.data.length});text+=c.data}
   else if(c.nodeType===1){if(c.tagName==='BR'){text+=' ';continue}const d=cs(c);if(d.startsWith('inline')||d==='contents')walk(c)}}};
  walk(unit);
 }
 const words=[...text.matchAll(WRE)].map(m=>({s:m.index,e:m.index+m[0].length}));
 return unit._b={text,segs,words};
}
function pick(x,y){
 const el=document.elementFromPoint(x,y);if(!el)return;
 const layer=el.closest('.textLayer');if(layer&&el===layer)return;
 let node=null,off=0;
 const scan=n=>{
  const nr=document.createRange();nr.selectNodeContents(n);const b=nr.getBoundingClientRect();
  if(x<b.left-6||x>b.right+6||y<b.top-6||y>b.bottom+6)return false;
  for(const m of n.data.matchAll(WRE)){const r=document.createRange();r.setStart(n,m.index);r.setEnd(n,m.index+m[0].length);
   for(const q of r.getClientRects())if(x>=q.left-3&&x<=q.right+3&&y>=q.top-3&&y<=q.bottom+3){node=n;off=m.index;return true}}
  return false};
 const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
 while(tw.nextNode())if(scan(tw.currentNode))break;
 if(!node)return;
 let unit=layer;if(!unit){unit=node.parentElement;while(unit&&cs(unit).startsWith('inline'))unit=unit.parentElement}
 if(!unit)return;
 const c=build(unit,!!layer),sg=c.segs.find(g=>g.node===node);if(!sg)return;
 const idx=sg.start+off,i=c.words.findIndex(w=>idx>=w.s&&idx<w.e);
 return i<0?undefined:{unit,c,i};
}
function selRects(c,s,e){const out=[];
 for(const g of c.segs){const a=Math.max(s,g.start),z=Math.min(e,g.start+g.len);
  if(a<z){const r=document.createRange();r.setStart(g.node,a-g.start);r.setEnd(g.node,z-g.start);out.push(...r.getClientRects())}}
 return out}
const union=rs=>rs.reduce((a,b)=>({left:Math.min(a.left,b.left),right:Math.max(a.right,b.right),top:Math.min(a.top,b.top),bottom:Math.max(a.bottom,b.bottom)}),{left:1e9,right:-1e9,top:1e9,bottom:-1e9});
function show(anchor){
 const c=S.unit._b,w=c.words,s=w[S.a].s,e=w[S.b].e;
 const txt=c.text.slice(s,e).replace(/\s+/g,' ').trim();
 highlight(document,selRects(c,s,e));
 const a=c.text.slice(0,s),z=c.text.slice(e),st=Math.max(a.lastIndexOf('. '),a.lastIndexOf('! '),a.lastIndexOf('? '))+1;
 let en=z.search(/[.!?]/);en=en<0?c.text.length:e+en+1;
 showPop(txt,union(selRects(c,w[anchor].s,w[anchor].e)),null,c.text.slice(st,en).trim());
}
function tap(e){
 const h=pick(e.clientX,e.clientY);
 if(!h){if(ps)hidePop();return}                       /* boş yerə klik → açıq tərcümə bağlanır */
 if(ps&&S&&S.unit===h.unit){                           /* eyni abzasda başqa sözə toxun → aradakı hamısı seçilir */
  if(h.i>S.b)S.b=h.i;else if(h.i<S.a)S.a=h.i;
  else if(S.a<S.b&&h.i===S.b)S.b--;else if(S.a<S.b&&h.i===S.a)S.a++;
  else{hidePop();return}
  show(h.i);return}
 if(ps){hidePop();return}                              /* başqa yerə klik → yalnız bağla */
 S={unit:h.unit,a:h.i,b:h.i};show(h.i);                /* açıq tərcümə yoxdursa → aç */
}
/* seçilmiş sözün vurğulanması */
let hl=[];
function highlight(d,rects){clearHL();hl=[...rects].map(r=>{const e=d.createElement('div');
 e.style.cssText=`position:fixed;left:${r.left-1}px;top:${r.top}px;width:${r.width+2}px;height:${r.height}px;background:rgba(242,193,78,.5);border-radius:3px;pointer-events:none;z-index:5`;
 d.body.append(e);return e})}
function clearHL(){hl.forEach(e=>e.remove());hl=[]}

/* ---------- tərcümə: Google (gtx) + ehtiyat olaraq MyMemory ---------- */
const cache={},dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
function chunk(text,n){const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text],ch=[];let c='';
 for(const p of parts){if((c+p).length>n&&c){ch.push(c);c=p}else c+=p}if(c)ch.push(c);return ch}
async function gtr(text){
 const sl=cfg.src==='Autodetect'?'auto':cfg.src;let t='',alts=[],src='';
 for(const [i,x] of chunk(text,1400).entries()){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=bd&hl='+cfg.dst+'&sl='+sl+'&tl='+cfg.dst+'&q='+encodeURIComponent(x.trim()));
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
  const part=(j[0]||[]).map(a=>a[0]).join('');if(!part)throw new Error('empty');
  t+=(i?' ':'')+part;if(i===0){alts=(j[1]||[]).map(g=>({pos:g[0],w:(g[1]||[]).slice(0,5)}));src=typeof j[2]==='string'?j[2]:''}}
 return{t,alts,src};
}
async function mm(text){
 const out=await Promise.all(chunk(text,450).map(async x=>{
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(x.trim())+'&langpair='+cfg.src+'|'+cfg.dst);
  const j=await r.json();if(+j.responseStatus!==200)throw new Error(j.responseDetails);return dec(j.responseData.translatedText)}));
 return{t:out.join(' '),alts:[],src:''};
}
let tc=LS('tcache',{});
function saveTc(k,v){tc[k]=v;const ks=Object.keys(tc);if(ks.length>2500)ks.slice(0,500).forEach(x=>delete tc[x]);
 try{SV('tcache',tc)}catch{ks.slice(0,ks.length/2).forEach(x=>delete tc[x]);try{SV('tcache',tc)}catch{}}}
async function tr(text){
 const k=cfg.src+'|'+cfg.dst+'|'+(/\s/.test(text)?text:text.toLowerCase());
 if(cache[k])return cache[k];if(tc[k])return cache[k]=tc[k];
 if(!navigator.onLine){const o=packLookup(text);if(o)return{t:o,alts:[],src:'',off:true}}
 let res;
 try{res=await gtr(text)}catch{try{res=await mm(text)}catch{
  const o=packLookup(text);if(o)return{t:o,alts:[],src:'',off:true};
  const d=dict.find(x=>x.w.toLowerCase()===text.toLowerCase());
  if(d)return{t:d.t,alts:[],src:d.lang||''};
  throw new Error(navigator.onLine?'Tərcümə alınmadı':'offline')}}
 saveTc(k,res);return cache[k]=res;
}

/* ---------- popup ---------- */
let ps=null,lastShow=0;
function showPop(text,rect,fr,ctx){
 lastShow=Date.now();
 const o=fr?fr.getBoundingClientRect():{left:0,top:0};
 ps={text,ctx,t:'',r:{l:rect.left+o.left,rt:rect.right+o.left,tp:rect.top+o.top,b:rect.bottom+o.top}};
 $('#pw').textContent=text;$('#pt').textContent='…';$('#pm').textContent='';$('#pop').hidden=false;starState();place();
 tr(text).then(r=>{if(!ps||ps.text!==text)return;
  ps.t=r.t;ps.lang=r.src||(cfg.src!=='Autodetect'?cfg.src:'');$('#pt').textContent=r.t;const m=[];
  if(r.off)m.push('Oflayn (kitab paketi)');
  if(cfg.src==='Autodetect'&&r.src){const L=LANGS.find(l=>l[0]===r.src);m.push('Dil: '+(L?L[1]:r.src))}
  if(!/\s/.test(text)&&r.alts.length)m.push(r.alts.map(a=>a.pos+': '+a.w.join(', ')).join('\n'));
  $('#pm').textContent=m.join('\n');place()})
 .catch(()=>{if(ps&&ps.text===text){$('#pt').textContent=navigator.onLine?'Tərcümə alınmadı. Dilləri ⚙ ilə yoxla və ya bir az sonra yenə cəhd et.':'İnternet yoxdur. Bu söz oflayn paketlərdə, əvvəlki tərcümələrdə və lüğətdə yoxdur.'}});
}
function place(){
 const p=$('#pop'),w=p.offsetWidth,h=p.offsetHeight,r=ps.r;
 let l=Math.max(8,Math.min(innerWidth-w-8,(r.l+r.rt)/2-w/2)),t=r.tp-h-10;
 if(t<8)t=r.b+10;t=Math.max(8,Math.min(innerHeight-h-8,t));p.style.left=l+'px';p.style.top=t+'px';
}
function hidePop(){$('#pop').hidden=true;ps=null;S=null;clearHL()}
const key=s=>s.toLowerCase();
function starState(){const has=ps&&dict.some(d=>key(d.w)===key(ps.text));$('#pStar').textContent=has?'★ Lüğətdədir':'☆ Lüğətə əlavə et'}
$('#pStar').onclick=()=>{if(!ps)return;const i=dict.findIndex(d=>key(d.w)===key(ps.text));
 if(i>=0)dict.splice(i,1);else dict.unshift({w:ps.text,t:ps.t,lang:ps.lang||'',ctx:ps.ctx,book:cur?cur.name:'',date:Date.now()});
 SV('dict',dict);starState();count()};

function say(t,lang){
 const l=(lang||(cfg.src==='Autodetect'?'en':cfg.src)).replace('_','-'),u=new SpeechSynthesisUtterance(t);u.lang=l;
 const vs=speechSynthesis.getVoices(),norm=v=>v.lang.replace('_','-').toLowerCase();
 const v=vs.find(v=>norm(v)===l.toLowerCase())||vs.find(v=>norm(v).startsWith(l.toLowerCase().slice(0,2)));
 if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
const count=()=>$('#cnt').textContent=dict.length;

$('#bDict').onclick=()=>{view('dict');renderDict()};

 if(!dict.length){d.innerHTML+='<div class="empty">Boşdur. Oxuyarkən sözə toxun və “Lüğətə əlavə et” düyməsini bas.</div>';return}
