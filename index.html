<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oxu">
<meta name="format-detection" content="telephone=no">
<title>Oxu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f3f4f6;--panel:#fff;--ink:#101114;--mute:#6b707b;--line:#dcdfe5;--acc:#2f3cff;--onacc:#fff;--mark:#ffe14d;--glass:#fff;
  --serif:"New York","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --read:Georgia,serif;--mx:32px;--lh:1.7;
}
html.dark,body.dark{--bg:#0f1115;--panel:#181b21;--ink:#eceef2;--mute:#8c93a1;--line:#272b34;--acc:#b8ff4d;--onacc:#0f1115;--glass:#181b21}
html.sepia,body.sepia{--bg:#efe5cf;--panel:#f7efdc;--ink:#35291a;--mute:#8a7860;--line:#dccfae;--acc:#a1580f;--onacc:#fff;--glass:#f7efdc;--mark:#f0d27a}
html.black,body.black{--bg:#000;--panel:#0d0d0e;--ink:#d9dce2;--mute:#7d8390;--line:#202126;--acc:#b8ff4d;--onacc:#000;--glass:#0d0d0e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{background:var(--bg);overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;overscroll-behavior:none;padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{border:1px solid transparent;background:none;border-radius:11px;padding:6px 10px;cursor:pointer;transition:transform .12s ease,background .18s,opacity .18s;touch-action:manipulation}
button:active{transform:scale(.94);background:rgba(127,127,127,.16)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(hover:hover){button:hover{background:var(--panel);border-color:var(--line)}}
.fill{background:var(--acc);color:var(--onacc);border-color:var(--acc);box-shadow:0 1px 3px #0002}
.fill:hover,.fill:active{background:var(--acc);color:var(--onacc);opacity:.9}
main{flex:1;min-height:0;position:relative;background:var(--bg);color:var(--ink)}
section{position:absolute;inset:0 0 calc(88px + env(safe-area-inset-bottom,0px)) 0;overflow:auto;overscroll-behavior:contain}
[hidden]{display:none!important}
.mu,.bn,.fc .cn{color:var(--mute)}
small{color:var(--mute)}
progress,button{font-family:inherit}
h2,h3,h4,p,ul,ol{margin-top:0}
input[type=search],input[type=text],input[type=number]{font:inherit;font-size:16px;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;-webkit-appearance:none;appearance:none}
select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

/* ---------- kitabxana ---------- */
#lib{max-width:720px;margin:auto;padding:20px 20px 34px}
#lib h2{font:700 46px/1 var(--serif);letter-spacing:-.02em;margin:8px 0 8px}
#lib .sub{font:11px/1.5 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:0 0 20px}
#bAdd{border-radius:999px;padding:12px 22px;font-weight:600}
#stats{display:flex;gap:26px;overflow-x:auto;margin:24px 0 8px;padding:0 0 6px;scrollbar-width:none}
#stats::-webkit-scrollbar{display:none}
#stats div{background:none;border:0;padding:0;text-align:left;flex:none}
#stats b{display:block;font:600 24px var(--serif)}
#stats span{font:10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
#stats .due b{color:var(--acc)}
#cont .cc{display:flex;gap:16px;align-items:center;padding:16px;margin-top:14px;background:var(--ink);color:var(--bg);border-radius:22px}
#cont .cv{width:88px;height:130px;flex:none;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0004;background:var(--panel)}
#cont .ci{flex:1;min-width:0}
#cont .nm2{font:700 21px/1.2 var(--serif);overflow-wrap:anywhere;margin:2px 0}
#cont small{color:inherit;opacity:.65;font:11px var(--mono);letter-spacing:.04em;text-transform:uppercase}
#cont .mini{background:rgba(127,127,127,.35);margin:8px 0 2px}
#cont .mini i{background:currentColor}
#cont .fill{background:var(--bg);color:var(--ink);border-color:var(--bg);border-radius:999px;flex:none}
#lq{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:12px 0;font-size:17px;margin-top:6px}
#lctl{display:flex;gap:8px;align-items:center;margin:12px 0 6px;flex-wrap:wrap}
#lf{display:flex;gap:18px;flex:1}
#lf .chip,#ls{border:0;border-radius:0;background:none;padding:6px 0;color:var(--mute);font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-bottom:2px solid transparent;box-shadow:none}
#lf .chip.on{color:var(--ink);border-bottom-color:var(--acc)}
#ls{color:var(--mute);font-size:11px}
#books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 16px;margin-top:14px}
@media(min-width:620px){#books{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){#books{grid-template-columns:repeat(4,minmax(0,1fr))}}
#books .empty{grid-column:1/-1}
.book{position:relative;display:block;padding:0;border:0}
.book .cv{width:100%;height:auto;aspect-ratio:2/3;border-radius:6px;box-shadow:0 14px 26px -12px #0007,0 0 0 1px #0000000f;margin-bottom:10px;overflow:hidden;background:var(--panel);cursor:pointer}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ph b{font:700 44px var(--serif)}
.ph small{font-size:9px;opacity:.85;letter-spacing:.08em;color:#fff}
.book .t{display:block}
.book .nm{font:600 16px/1.25 var(--serif);cursor:pointer;overflow-wrap:anywhere}
.book small{display:block;font:11px/1.5 var(--mono);color:var(--mute);margin-top:3px}
.book .del{position:absolute;top:8px;right:8px;width:28px;height:28px;padding:0;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;border:0;z-index:2}
.book .act{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.book .act button{border:1px solid var(--line);border-radius:999px;font:600 10px var(--mono);letter-spacing:.03em;text-transform:uppercase;padding:4px 9px;color:var(--mute)}
.book .act button:disabled{opacity:.4}
.book .jp{font:10px var(--mono);color:var(--acc)}
.mini{height:2px;background:var(--line);border-radius:3px;margin:8px 0 2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--acc);transition:width .3s}
.empty{color:var(--mute);padding:24px 0;line-height:1.6}

/* ---------- oxuyucu ---------- */
#reader{display:flex;flex-direction:column;overflow:hidden}
#rtop{flex:none;display:flex;align-items:center;gap:6px;padding:8px 8px 4px 18px;font:11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt{display:flex;gap:2px;flex:none}
.rt button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:10px;color:var(--mute)}
.rt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#pbar{position:relative;flex:none;height:2px;background:var(--line);z-index:1;overflow:hidden}
#pbar i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s ease;border-radius:0 3px 3px 0}
#stage{flex:1;min-height:0;position:relative}
#epubView{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ebody{max-width:700px;margin:0 auto;padding:22px var(--mx,32px) 90px;font:20px/var(--lh,1.7) var(--read,Georgia,serif);overflow-wrap:break-word;font-size:20px}
.ebody p{margin:0 0 .9em}
.ebody h1,.ebody h2,.ebody h3,.ebody h4{line-height:1.25;margin:1.4em 0 .5em}
.ebody h1{font-size:1.6em}.ebody h2{font-size:1.35em}.ebody h3{font-size:1.15em}
.ebody img,.ebody svg{max-width:100%;max-height:78vh;height:auto;object-fit:contain;border-radius:4px}
.ebody a{color:inherit;text-decoration:none;border-bottom:1px solid var(--acc)}
.ebody blockquote{margin:1em 0;padding:0 0 0 16px;border-left:3px solid var(--line);color:var(--mute)}
.ebody ul,.ebody ol{padding-left:1.4em;margin:0 0 1em}
.ebody li{margin:.3em 0}
.ebody table{max-width:100%;border-collapse:collapse;display:block;overflow-x:auto}
.ebody pre{white-space:pre-wrap;font:13px/1.5 var(--mono);background:rgba(127,127,127,.1);padding:10px;border-radius:8px;overflow:auto}
.ebody .hit{background:var(--mark);color:#1b2420;border-radius:3px;box-shadow:0 0 0 3px var(--mark)}
#pdfView{position:absolute;inset:0;overflow:auto;text-align:center;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#txtView{position:absolute;inset:0;overflow:auto;padding:22px max(var(--mx,32px),calc(50% - 360px)) 90px;font:20px/var(--lh,1.7) var(--read,Georgia,serif);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;overflow-wrap:break-word}
#txtView p{margin:0 0 .85em}
#txtView h3{font:600 1.15em/1.3 var(--serif);margin:1.6em 0 .6em;color:var(--acc)}
#txtView .hit{background:var(--mark);color:#1b2420}
#epubView,#pdfView,#txtView{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pg{position:relative;margin:8px auto;background:#fff;box-shadow:0 1px 8px #0003}
body.dark .pg canvas,body.black .pg canvas{filter:invert(.9) hue-rotate(180deg)}
body.sepia .pg canvas{filter:sepia(.4) contrast(.96)}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-size-adjust:none}
.textLayer span{position:absolute;color:transparent;white-space:pre;transform-origin:0 0;cursor:text}
.textLayer ::selection{background:#f2c14e88}
#bar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 8px 6px;color:var(--mute);font-size:13px}
#bPrev,#bNext{font:28px/1 var(--serif);padding:0 14px;color:var(--ink)}
#bTts{background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 14px;font-size:12px;min-width:44px}
#prog{min-width:110px;text-align:center;font:11px var(--mono);letter-spacing:.03em;text-transform:uppercase}
#bRate{font:11px var(--mono);border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.tts{background:rgba(242,193,78,.32);border-radius:4px;box-shadow:0 0 0 3px rgba(242,193,78,.32)}
body.focus section{bottom:0}
body.focus #reader{padding-bottom:0}
body.focus #rtop,body.focus #bar,body.focus #tabs{display:none}
body.focus #stage{overscroll-behavior:none}
body.focus #pbar{position:absolute;top:0;left:0;right:0;z-index:3}

/* ---------- alt naviqasiya ---------- */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:min(400px,calc(100% - 28px));display:flex;padding:6px;border:1px solid #2b2f38;border-radius:30px;background:#14161b;box-shadow:0 14px 34px -8px #000a;z-index:6}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:24px;color:#8f96a3;padding:8px 2px;font:600 10px var(--mono);letter-spacing:.04em;text-transform:uppercase}
#tabs svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tabs i{font:600 17px/21px var(--serif);font-style:normal;color:inherit}
#tabs button.on,#tabs button.on i{color:#fff}
#tabs button.on{background:#262a33}
#cnt{color:#b8ff4d;font-weight:700}

/* ---------- üzən panellər ---------- */
#dim{position:fixed;inset:0;background:#000;pointer-events:none;z-index:5;opacity:0;transition:opacity .15s}
#qp{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:auto;max-width:560px;background:var(--panel);border-radius:22px 22px 0 0;padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #0004;animation:up .22s ease-out;color:var(--ink);max-height:70vh;overflow:auto}
@keyframes up{from{transform:translateY(40px)}}
#qp .qh{display:flex;align-items:center;gap:14px;padding:8px 0 10px;border-bottom:1px solid var(--line)}
#qp .qh b{font-size:17px;flex:1}
#qx{font-size:20px;padding:4px 10px}
#qp .qs{padding:12px 0;border-bottom:1px solid var(--line)}
#qp .qs:last-child{border:0}
#qp h4,.sheet h4{margin:0 0 10px;font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#qp .sl{display:flex;align-items:center;gap:12px}
#qp .sl input{flex:1;accent-color:var(--acc);height:28px}
.row2{display:flex;gap:8px;margin-top:12px}
.row2.h{overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.row2.h::-webkit-scrollbar{display:none}
#qp .chip{border-radius:20px;white-space:nowrap;flex:none;padding:9px 16px;border:1px solid var(--line);background:var(--panel);font-size:14px}
#qp .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ic{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.ic.s{font-size:12px}.ic.big{font-size:21px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid #8886;margin-right:8px;vertical-align:-2px}

/* ---------- vərəq (içindəkilər / axtarış / əlfəcin / parametrlər) ---------- */
#sheetWrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
#sheet{opacity:1;position:relative;z-index:1;width:min(620px,100%);max-height:88vh;overflow:auto;background:var(--panel);color:var(--ink);border-radius:22px 22px 0 0;padding:6px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #0005;animation:up .2s ease-out;overscroll-behavior:contain}
#sheet .sh{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);z-index:2}
#sheet .sh b{flex:1;font:600 18px var(--serif)}
#shX{font-size:20px;padding:4px 10px}
.toc button{display:block;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);border-radius:0;font-size:15px;line-height:1.35}
.toc button .d{color:var(--mute);font-size:12px;margin-right:6px}
.toc button[data-d="1"]{padding-left:18px}
.toc button[data-d="2"]{padding-left:34px}
.toc button[data-d="3"]{padding-left:50px}
.sres button{display:block;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line);border-radius:0}
.sres b{display:block;font:600 12px var(--mono);color:var(--acc);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.sres span{font-size:14px;color:var(--ink);line-height:1.4}
.sres mark{background:var(--mark);color:#1b2420;border-radius:2px}
.mark{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.mark .mi{flex:1;min-width:0;cursor:pointer}
.mark b{display:block;font:600 15px var(--serif);overflow-wrap:anywhere}
.mark small{font:11px var(--mono);color:var(--mute)}
.mark .note{font-size:13px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere}
.fld{margin:0 0 14px}
.fld label{display:block;color:var(--mute);font-size:13px;margin:0 0 5px}
.fld select,.fld input{width:100%}
.rowsel{display:flex;gap:8px;align-items:center}
.rowsel select{flex:1}
.icb{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:17px}
.setrow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.setrow button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.setrow button.danger{color:#c0392b;border-color:#c0392b66}
.setrow button.fill{color:var(--onacc)}
.okline{font:12px var(--mono);color:var(--mute);margin:6px 0 14px;word-break:break-word}

/* ---------- seçim / tərcümə kartı ---------- */
#pop{position:fixed;z-index:32;display:flex;flex-direction:column;width:min(360px,calc(100vw - 16px));background:var(--panel);animation:pin .16s ease-out;color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;box-shadow:0 18px 40px -12px #0008;padding:12px 14px}
@keyframes pin{from{opacity:0;transform:translateY(4px) scale(.98)}}
#pw{flex:none;font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--mute);max-height:54px;overflow:auto}
#pt{flex:1 1 auto;min-height:0;font:22px/1.3 var(--serif);margin:4px 0 8px;max-height:34vh;overflow:auto}
#pm{flex:none;font:12px/1.5 var(--mono);color:var(--mute);white-space:pre-line;margin:-2px 0 8px;max-height:22vh;overflow:auto}
#pm:empty{display:none}
#pa{flex:none;display:flex;gap:4px;flex-wrap:wrap}
#pa button{border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:13px}
#pa .fill{border-color:var(--acc)}

/* ---------- lüğət ---------- */
#dict{padding:20px 20px 40px;max-width:760px;margin:auto;left:0;right:0}
#dict h2{font:600 28px var(--serif);margin:8px 0 12px}
#dict h3{font:600 19px var(--serif);margin:14px 0 8px;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;margin:0 0 14px}
.seg button{flex:1;border:1px solid var(--line);padding:9px 6px;font-size:14px;border-radius:12px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bk{display:flex;align-items:center;gap:10px;padding:14px;margin-bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.bk .bi{flex:1;min-width:0;cursor:pointer}
.bk .bi b{display:block;font:600 16px var(--serif);overflow-wrap:anywhere}
.bk .bi small{color:var(--mute)}
.bk .ba{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bk .ba button{border:1px solid var(--line);border-radius:999px;font-size:12px;padding:5px 10px}
.dbar{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.dbar input{flex:1;min-width:120px}
.dbar button{border:1px solid var(--line);border-radius:999px;font-size:12px;padding:6px 11px;white-space:nowrap}
.row{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
.row .rw{flex:1;min-width:0;cursor:pointer}
.row b{font:600 18px var(--serif)}
.row i{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.row .df{font-size:14px;color:var(--mute);margin-top:2px}
.row .df i{display:inline;color:var(--acc);font-style:italic}
.lv{margin-left:8px;font-size:9px;letter-spacing:1px;color:var(--acc)}
.wv h2{font:600 32px var(--serif);margin:12px 0 0}
.wv h4{margin:18px 0 6px;font:600 12px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.wv li{margin:6px 0}
.wv ol,.wv ul{padding-left:20px;margin:0}
.wv .ph2{color:var(--mute);font:14px var(--mono);min-height:1px}
.wr{padding:6px 0;border-bottom:1px solid var(--line)}
mark{background:var(--mark);color:#1b2420;border-radius:3px;padding:0 2px}
.lset label{display:block;color:var(--mute);font-size:13px;margin:12px 0 5px}
.lset select{width:100%}

/* ---------- test ---------- */
.qz{max-width:560px;margin:auto;padding-top:6px}
.qt{display:flex;align-items:center;gap:10px;margin-bottom:16px;color:var(--mute);font-size:13px}
.qb{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.qb i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qk{color:var(--mute);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.qp2{font:22px/1.4 var(--serif);margin:10px 0 18px}
.qp2 .big{font:600 34px var(--serif)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin:0 0 8px;border:1px solid var(--line);background:var(--panel);border-radius:14px;font-size:16px}
.opt:disabled{opacity:1}
.opt.ok{border-color:#2f9e6b;background:rgba(47,158,107,.18)}

<script>
'use strict';
/* ================= 1. KÖMƏKÇİLƏR ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=sec=>{sec=Math.max(0,Math.round(sec||0));if(sec<60)return sec+' san';const m=Math.round(sec/60);return m<60?m+' dəq':Math.floor(m/60)+' s '+(m%60)+' dəq'};
const today=()=>'day:'+new Date().toLocaleDateString('sv');
const htmlText=s=>{if(s==null)return '';if(!/[<&]/.test(s))return String(s).replace(/\s+/g,' ').trim();const d=document.createElement('div');d.innerHTML=s;return (d.textContent||'').replace(/\s+/g,' ').trim()};
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

/* yaddaş: localStorage dolu olsa da tətbiq dayanmasın */
const mem={};
function LS(k,d){try{const v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch{return k in mem?mem[k]:d}}
function SV(k,v){
  mem[k]=v;
  try{localStorage.setItem(k,JSON.stringify(v));return true}catch{}
  try{localStorage.removeItem('tcache');localStorage.setItem(k,JSON.stringify(v));return true}catch{}
  try{for(const key of Object.keys(localStorage))if(key.indexOf('cover:')===0)localStorage.removeItem(key);localStorage.setItem(k,JSON.stringify(v));return true}catch{}
  return false;
}
let toastT;
function toast(msg,ms=2800,action){
  const t=$('#toast');t.innerHTML='';t.hidden=false;
  const s=document.createElement('span');s.textContent=msg;t.append(s);
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{t.hidden=true;try{action.fn()}catch{}};t.append(b)}
  clearTimeout(toastT);if(ms>0)toastT=setTimeout(()=>{t.hidden=true},ms);
}
function requestPersist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch{}}

/* ================= 2. AYARLAR ================= */
const DEF={src:'Autodetect',dst:'az',size:110,theme:'light',font:'serif',dim:0,margin:1,lh:1.7,rate:1};
const saved=LS('cfg',{});
let cfg=Object.assign({},DEF,saved||{});
if(!cfg.theme)cfg.theme=saved&&saved.dark?'dark':'light';
if(!THEMES_OK(cfg.theme))cfg.theme='light';
cfg.size=clamp(+cfg.size||110,70,220);
cfg.margin=clamp(Number(cfg.margin)||0,0,2);
cfg.lh=clamp(+cfg.lh||1.7,1.4,2.1);
cfg.rate=clamp(+cfg.rate||1,0.5,2);
function THEMES_OK(x){return ['light','sepia','dark','black'].indexOf(x)>=0}
const FONTS={serif:'Charter,"Iowan Old Style",Georgia,serif',georgia:'Georgia,"Times New Roman",serif',sans:'-apple-system,"SF Pro Text",Inter,system-ui,sans-serif',mono:'"SF Mono",Menlo,Courier,monospace'};
const FN={serif:'Charter',georgia:'Georgia',sans:'Sans',mono:'Mono'};
const THEMES=[['light','Açıq'],['sepia','Sepia'],['dark','Tünd'],['black','Gecə']];
const LANGS=[['Autodetect','Avtomatik'],['az','Azərbaycanca'],['tr','Türkçe'],['en','English'],['ru','Русский'],['ar','العربية'],['fa','فارسی'],['ka','ქართული'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['pt','Português'],['nl','Nederlands'],['pl','Polski'],['uk','Українська'],['be','Беларуская'],['sv','Svenska'],['no','Norsk'],['da','Dansk'],['fi','Suomi'],['cs','Čeština'],['sk','Slovenčina'],['hu','Magyar'],['ro','Română'],['bg','Български'],['el','Ελληνικά'],['sr','Српски'],['hr','Hrvatski'],['sl','Slovenščina'],['lt','Lietuvių'],['lv','Latviešu'],['et','Eesti'],['he','עברית'],['hi','हिन्दी'],['ur','اردو'],['zh-CN','中文 (sadə)'],['zh-TW','中文 (ənənəvi)'],['ja','日本語'],['ko','한국어'],['vi','Tiếng Việt'],['th','ไทย'],['id','Indonesia'],['ms','Melayu'],['sw','Kiswahili'],['kk','Қазақша'],['uz','Oʻzbekcha'],['ky','Кыргызча'],['tg','Тоҷикӣ'],['hy','Հայերեն'],['sq','Shqip'],['af','Afrikaans'],['am','አማርኛ'],['ne','नेपाली'],['si','සිංහල'],['ta','தமிழ்'],['te','తెలుగు'],['bn','বাংলা'],['mr','मराठी'],['gu','ગુજરાતી'],['kn','ಕನ್ನಡ'],['ml','മലയാളം'],['pa','ਪੰਜਾਬੀ'],['my','မြန်မာ'],['km','ខ្មែរ'],['lo','ລາວ'],['mn','Монгол']];
const MX=[16,32,52];
let dict=LS('dict',[]);if(!Array.isArray(dict))dict=[];dict=dict.filter(x=>x&&typeof x==='object'&&x.w);
const packIdx={};
let job=null, cur=null, book=null, secs=[], ci=0, pdf=null, pg=1, txt=null;
let pdfRender=null, pdfRenderSeq=0, pdfOutlineCache=null;
let lastLang='';
function isDue(x){return !x.due||x.due<=Date.now()}
function prg(b){return clamp(+LS('prg:'+b.id,0)||0,0,1)}
function opn(b){return +LS('open:'+b.id,0)||0}
const count=()=>{const c=$('#cnt');if(c)c.textContent=dict.length};

/* ================= 3. TEM ================= */
function applyTheme(){
  for(const e of [document.body,document.documentElement]){e.classList.remove('dark','sepia','black');if(cfg.theme!=='light')e.classList.add(cfg.theme)}
  document.documentElement.style.colorScheme=(cfg.theme==='dark'||cfg.theme==='black')?'dark':'light';
  const bg=getComputedStyle(document.body).getPropertyValue('--bg').trim()||'#f3f4f6';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=bg;
  applyDim();applyTextStyle();
}
function applyDim(){const o=clamp((cfg.dim||0)/100,0,.85),d=$('#dim');d.style.opacity=o;d.style.display=o?'block':'none'}
function applyTextStyle(){
  const root=document.documentElement;
  root.style.setProperty('--read',FONTS[cfg.font]||FONTS.serif);
  root.style.setProperty('--mx',MX[clamp(cfg.margin|0,0,2)]+'px');
  root.style.setProperty('--lh',String(cfg.lh||1.7));
  const fs=(cfg.size/110*20)+'px';
  const b=document.querySelector('.ebody');if(b)b.style.fontSize=fs;
  const t=$('#txtView');if(t&&cur&&cur.type==='txt')t.style.fontSize=fs;
}
function reflow(fn){
  const v=cur&&cur.type==='epub'?$('#epubView'):cur&&cur.type==='txt'?$('#txtView'):null;
  if(!v){fn();return}
  const max=Math.max(1,v.scrollHeight-v.clientHeight),r=v.scrollTop/max;
  fn();
  requestAnimationFrame(()=>{v.scrollTop=r*Math.max(0,v.scrollHeight-v.clientHeight)});
}

/* ================= 4. YADDAŞ (IndexedDB) ================= */
const DB=new Promise((res,rej)=>{
  const r=indexedDB.open('oxu',3);
  r.onupgradeneeded=()=>{const d=r.result;for(const n of ['books','packs','covers'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
});
function idb(mode,fn,store='books'){
  return DB.then(d=>new Promise((res,rej)=>{
    let t;try{t=d.transaction(store,mode)}catch(e){return rej(e)}
    let o;try{o=fn(t.objectStore(store))}catch(e){try{t.abort()}catch{};return rej(e)}
    t.oncomplete=()=>{try{res(o&&'result'in o?o.result:undefined)}catch{res(undefined)}};
    t.onerror=()=>rej(t.error||new Error('db'));
    t.onabort=()=>rej(t.error||new Error('aborted'));
  }));
}
async function loadPacks(){try{const all=await idb('readonly',s=>s.getAll(),'packs');(all||[]).forEach(p=>{if(p&&p.id)packIdx[p.id]=p})}catch{}}

/* ================= 5. ÜZ QAPAQLARI ================= */
const coverMem={},coverTried=new Set();
async function coverFor(b){
  if(!b||b.type==='txt')return null;
  if(Object.prototype.hasOwnProperty.call(coverMem,b.id))return coverMem[b.id];
  try{const row=await idb('readonly',s=>s.get(b.id),'covers');if(row&&row.data){coverMem[b.id]=row.data;return row.data}}catch{}
  let url=null;try{url=await makeCover(b)}catch{}
  coverMem[b.id]=url;
  if(url){try{await idb('readwrite',s=>s.put({id:b.id,data:url}),'covers')}catch{}}
  return url;
}
function coverHtml(b,url){
  if(url)return '<img src="'+url+'" alt="" loading="lazy">';
  let h=0;const n=b.name||'?';for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;
  return '<div class="ph" style="background:linear-gradient(150deg,hsl('+h+',40%,40%),hsl('+((h+40)%360)+',46%,22%))"><b>'+esc((n.trim().charAt(0)||'?').toUpperCase())+'</b><small>'+esc((b.type||'').toUpperCase())+'</small></div>';
}
async function makeCover(b){
  const W=180,cv=document.createElement('canvas');
  if(b.type==='pdf'){
    if(!window.pdfjsLib)return null;
    const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;
    const p1=await d.getPage(1),v0=p1.getViewport({scale:1}),vp=p1.getViewport({scale:W/v0.width});
    cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    await p1.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    try{d.destroy()}catch{}
    return cv.toDataURL('image/jpeg',.72);
  }
  if(b.type==='epub'){
    await needEpub();
    const bk=ePub(await b.blob.arrayBuffer(),{openAs:'binary'});await bk.ready;
    const u=await bk.coverUrl();
    if(!u){try{bk.destroy()}catch{};return null}
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
    cv.width=W;cv.height=Math.max(1,Math.round(img.naturalHeight*W/img.naturalWidth));
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    try{bk.destroy()}catch{}
    return cv.toDataURL('image/jpeg',.72);
  }
  return null;
}
let coverBusy=false;
async function fillCovers(list){
  if(coverBusy)return;coverBusy=true;
  try{
    for(const b of list){
      if(b.type==='txt'||coverTried.has(b.id))continue;
      let url=null;try{url=await coverFor(b)}catch{}
      coverTried.add(b.id);
      if(url)$$('[data-cv="'+b.id+'"]').forEach(e=>{e.innerHTML='<img src="'+url+'" alt="" loading="lazy">'});
    }
  }finally{coverBusy=false}
}

/* ================= 6. KİTABXANA ================= */
let libQ='',libF=LS('libF','all'),libS=LS('libS','recent'),libT=0,libSeq=0,libAll=[];
if(['all','reading','done'].indexOf(libF)<0)libF='all';
if(['recent','name','added','status'].indexOf(libS)<0)libS='recent';
function posText(b){
  const q=LS('pos:'+b.id,null);
  if(b.type==='epub'&&q&&typeof q==='object')return 'Fəsil '+(q.i+1);
  if(b.type==='pdf'&&typeof q==='number')return 'Səhifə '+q;
  if(b.type==='txt'&&q&&typeof q==='object')return Math.round(prg(b)*100)+'%';
  return '';
}
function meta(b){

async function jget(u,ms){
  let r;const ctl=new AbortController();
  const to=setTimeout(()=>ctl.abort(),ms||15000);
  try{r=await fetch(u,{credentials:'omit',signal:ctl.signal})}
  catch(e){
    clearTimeout(to);
    throw new Error(e&&e.name==='AbortError'?'Server cavab vermədi':'Şəbəkə xətası (internet yoxdur?)');
  }
  clearTimeout(to);
  if(!r.ok)throw new Error('Server xətası: HTTP '+r.status);
  return r.json();
}

async function catGet(it,btn){
  if(CAT.busy){toast('Başqa yükləmə davam edir…');return}

  CAT.busy=true;btn.disabled=true;

    else await wsDownload(it);
    btn.textContent='✓';btn.classList.add('done');
  }catch(e){
    console.error(e);
    btn.textContent=label;btn.disabled=false;
    toast('Yüklənmədi: '+((e&&e.message)||e),5000);

async function wsDownload(it){
  const lang=it.lang,title=it.title;
  setCatStat('Bölmələr yoxlanılır…');
  const subs=await wsSubpages(lang,title);
  if(subs.length){
    const ord=await wsOrder(lang,title);
    if(ord.length){
      const idx={};ord.forEach((t,i)=>{idx[t]=i});
      const big=1e6;
      subs.sort((a,b)=>{
        const ia=a in idx?idx[a]:big,ib=b in idx?idx[b]:big;
        return ia-ib||a.localeCompare(b,'az',{numeric:true,sensitivity:'base'});
      });
    }
  }
  const pages=subs.length?subs:[title];
  if(pages.length>600)throw new Error('Çox böyük əsər ('+pages.length+' bölmə)');
  const out=new Array(pages.length);let done=0;
  await pool(pages,4,async(p,i)=>{
    out[i]=await wsSection(lang,p);
    done++;setCatStat('Yüklənir… '+done+'/'+pages.length);
  });
  const secs2=out.filter(s=>s&&s.html&&s.html.length>20);
  if(!secs2.length)throw new Error('Mətn tapılmadı');
  setCatStat('EPUB hazırlanır…');
  const blob=await buildEpub({title:readable(title),author:'Vikimənbə',lang,sections:secs2});
  await saveBook(blob,readable(title));
  setCatStat('✓ Kitabxanaya əlavə olundu');
}

async function wsOrder(lang,title){
  try{
    const u='https://'+lang+'.wikisource.org/w/api.php?action=parse&redirects=1&page='+
      encodeURIComponent(title)+'&prop=text&disableeditsection=1&format=json&origin=*';
    const j=await jget(u);
    const html=(j&&j.parse&&j.parse.text&&j.parse.text['*'])||'';
    const doc=new DOMParser().parseFromString(html,'text/html');
    const pre=String(title).replace(/_/g,' ')+'/';
    const out=[],seen={};
    doc.querySelectorAll('a[href*="/wiki/"]').forEach(a=>{
      let h=a.getAttribute('href')||'';
      const i=h.indexOf('/wiki/');
      if(i<0)return;
      h=h.slice(i+6).split('#')[0];
      let t;try{t=decodeURIComponent(h)}catch{t=h}
      t=t.replace(/_/g,' ').trim();
      if(t.indexOf(pre)===0&&!seen[t]){seen[t]=1;out.push(t)}
    });
    return out;
  }catch{return []}
}
async function wsSubpages(lang,title){
  const out=[];let cont='';
  for(let guard=0;guard<10;guard++){
    const u='https://'+lang+'.wikisource.org/w/api.php?action=query&list=allpages&apprefix='+
      encodeURIComponent(title+'/')+'&aplimit=500&format=json&origin=*'+(cont?'&apcontinue='+encodeURIComponent(cont):'');
    const j=await jget(u);
    ((j&&j.query&&j.query.allpages)||[]).forEach(p=>{if(p&&p.title&&p.title!==title)out.push(p.title)});
    cont=j&&j.continue&&j.continue.apcontinue;
    if(!cont)break;
  }
  return out.sort((a,b)=>a.localeCompare(b,'az',{numeric:true,sensitivity:'base'}));
}

async function wsSection(lang,title){
  const u='https://'+lang+'.wikisource.org/w/api.php?action=parse&redirects=1&page='+
    encodeURIComponent(title)+'&prop=text&disableeditsection=1&disabletoc=1&format=json&origin=*';
  let j;
  try{j=await jget(u)}catch{return null}
  if(!j||j.error)return null;
  const raw=(j.parse&&j.parse.text&&j.parse.text['*'])||'';
  const body=wsClean(raw);
  if(!body)return null;
  const t=readable(title);
  const head=/^<h[1-6]/.test(body)?'':'<h2 class="st">'+esc(t)+'</h2>';
  return {title:t,html:head+body};
}

function readable(t){
  let s=String(t||'').replace(/_/g,' ').replace(/\s+/g,' ').trim();
  const i=s.lastIndexOf('/');
  if(i>=0)s=s.slice(i+1);
  return s.slice(0,120)||'Adsız';
}

/* ---- Wikisource HTML → sadə XHTML ---- */
const WS_INLINE={B:'b',STRONG:'strong',I:'i',EM:'em',U:'u',S:'s',DEL:'del',INS:'ins',SMALL:'small',SUB:'sub',SUP:'sup',CODE:'code',MARK:'mark',CITE:'cite',Q:'q',ABBR:'abbr',VAR:'var',KBD:'kbd'};
const WS_HEAD={H1:'h2',H2:'h2',H3:'h3',H4:'h4',H5:'h5',H6:'h6'};
const WS_BLK={P:1,BLOCKQUOTE:1,PRE:1,LI:1,DT:1,DD:1,UL:1,OL:1,DIV:1,SECTION:1,ARTICLE:1,CENTER:1,FIGURE:1,HEADER:1,FOOTER:1,ASIDE:1,MAIN:1};

function wsClean(raw){
  let doc;
  try{doc=new DOMParser().parseFromString(String(raw||''),'text/html')}catch{return ''}
  const root=doc.body;
  if(!root)return '';
  try{
    root.querySelectorAll('script,style,noscript,link,meta,table,thead,tbody,tr,td,th,caption,colgroup,col,'+
      '.mw-editsection,.noprint,.ws-noexport,.ws-header,.sistersitebox,#toc,.toc,.mw-references-wrap,'+
      '.references,sup.reference,.navbox,.catlinks,.mw-empty-elt,.mw-cite-backlink,.mw-indicators,'+
      '.mw-jump-link,.printfooter,.mw-headline-number,.metadata,.ambox,.mbox-small').forEach(n=>n.remove());
  }catch{}
  let html='';
  try{for(const c of root.childNodes)html+=wsNode(c)}catch{return ''}
  return html
    .replace(/<p>(\s|&nbsp;|<br\/>)*<\/p>/g,'')
    .replace(/<li>(\s|&nbsp;)*<\/li>/g,'')
    .replace(/(<br\/>)(\s|<br\/>)+/g,'<br/>')
    .replace(/[ \t]{2,}/g,' ')
    .trim();
}
function wsNode(n){
  if(n.nodeType===3)return esc(String(n.nodeValue).replace(/[ \t\r\n\u00a0]+/g,' ').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,''));
  if(n.nodeType!==1)return '';
  const tag=n.tagName.toUpperCase();
  if(tag==='BR')return '<br/>';
  if(tag==='HR')return '<hr/>';
  if(tag==='IMG')return '';
  if(WS_HEAD[tag]){
    const inner=wsKids(n).trim();
    return inner?'<'+WS_HEAD[tag]+'>'+inner+'</'+WS_HEAD[tag]+'>':'';
  }
  if(tag==='P'||tag==='BLOCKQUOTE'||tag==='PRE'||tag==='LI'||tag==='DT'||tag==='DD'){
    const inner=wsKids(n).trim();
    if(!inner)return '';
    const t=tag.toLowerCase();
    return '<'+t+'>'+inner+'</'+t+'>';
  }
  if(tag==='UL'||tag==='OL'){
    const inner=wsKids(n).trim();
    return inner?'<'+tag.toLowerCase()+'>'+inner+'</'+tag.toLowerCase()+'>':'';
  }
  if(WS_INLINE[tag]){
    const inner=wsKids(n);
    return inner.trim()?'<'+WS_INLINE[tag]+'>'+inner+'</'+WS_INLINE[tag]+'>':'';
  }
  if(tag==='A')return wsKids(n);
  const inner=wsKids(n).trim();
  if(!inner)return '';
  if(tag==='DIV'||tag==='SECTION'||tag==='ARTICLE'||tag==='CENTER'||tag==='FIGURE'||tag==='HEADER'||tag==='FOOTER'||tag==='ASIDE'||tag==='MAIN'){
    let blk=false;
    for(const c of n.children){
      const t2=c.tagName.toUpperCase();
      if(WS_BLK[t2]||WS_HEAD[t2]){blk=true;break}
    }
    return blk?inner:'<p>'+inner+'</p>';
  }
  return inner;
}
function wsKids(n){
  let s='';
  for(const c of n.childNodes)s+=wsNode(c);
  return s;
}

async function pool(arr,n,fn){
  let i=0;
  const w=Math.max(1,Math.min(n,arr.length));
  await Promise.all(new Array(w).fill(0).map(async()=>{
    for(;;){const k=i++;if(k>=arr.length)return;await fn(arr[k],k)}
  }));
}

/* ---- EPUB yaratma ---- */
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);
  });
}
function epubCover(title,author){
  try{
    const W=600,H=900,cv=document.createElement('canvas');cv.width=W;cv.height=H;
    const g=cv.getContext('2d'),s=String(title||'?');
    let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;
    const gr=g.createLinearGradient(0,0,W,H);
    gr.addColorStop(0,'hsl('+h+',42%,34%)');
    gr.addColorStop(1,'hsl('+((h+46)%360)+',48%,15%)');

/* ---- Gutenberg (proxy ilə) ---- */
function proxyUrl(proxy,url){
  const p=String(proxy||'').trim();
  if(!p)return url;
  if(p.indexOf('{url}')>=0)return p.replace('{url}',encodeURIComponent(url));
  if(/[?&=]$/.test(p))return p+encodeURIComponent(url);
  return p.replace(/\/$/,'')+'/?url='+encodeURIComponent(url);
}
async function fetchBlob(u){
  const r=await fetch(u,{credentials:'omit',redirect:'follow'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const b=await r.blob();
  if(b.size<1000)throw new Error('Fayl boşdur');
  const h=new Uint8Array(await b.slice(0,4).arrayBuffer());
  if(!(h[0]===0x50&&h[1]===0x4b&&h[2]===0x03&&h[3]===0x04))throw new Error('EPUB deyil');
  return b;
}
async function pgDownload(it){
  if(!it.dl)throw new Error('EPUB versiyası yoxdur');
  const proxy=(cfg.proxy||'').trim();
  if(!proxy){
    toast('Gutenberg birbaşa yükləməyə icazə vermir — fayl yeni pəncərədə açılır',6000);
    try{window.open(it.dl,'_blank')}catch{}
    throw new Error('Proxy lazımdır (Parametrlər → Kataloq)');
  }
  setCatStat('Yüklənir…');
  const blob=await fetchBlob(proxyUrl(proxy,it.dl));
  setCatStat('EPUB hazırlanır…');
  await saveBook(blob,it.title);
  setCatStat('✓ Kitabxanaya əlavə olundu');
}

async function openPdf(b){

async function renderPdf(){
  if(!pdf||!cur)return;
  const v=$('#pdfView');if(!v)return;
  const seq=++pdfRenderSeq;
  if(pdfRender){try{pdfRender.cancel()}catch{};pdfRender=null}
  const page=await pdf.getPage(pg);
  if(seq!==pdfRenderSeq)return;
  const base=page.getViewport({scale:1});
  const avail=Math.max(220,(v.clientWidth||innerWidth)-20);
  const scale=clamp(Math.min(avail/base.width,3)*cfg.size/110,.3,4);
  const vp=page.getViewport({scale});
  const dpr=clamp(devicePixelRatio||1,1,3);
  const wrap=document.createElement('div');wrap.className='pg';
  wrap.style.width=Math.round(vp.width)+'px';wrap.style.height=Math.round(vp.height)+'px';
  const cv=document.createElement('canvas');
  cv.width=Math.round(vp.width*dpr);cv.height=Math.round(vp.height*dpr);
  cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
  const tl=document.createElement('div');tl.className='textLayer';
  tl.style.setProperty('--scale-factor',String(vp.scale));
  wrap.append(cv,tl);

  setProg(pg/pdf.numPages);SV('pos:'+cur.id,pg);
  const task=page.render({canvasContext:cv.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
  pdfRender=task;
  try{await task.promise}catch(e){if(seq!==pdfRenderSeq)return;if(e&&e.name==='RenderingCancelledException')return;throw e}
  if(seq!==pdfRenderSeq)return;
  pdfRender=null;
  try{
    const tc=await page.getTextContent();
    if(seq!==pdfRenderSeq)return;
    const r=pdfjsLib.renderTextLayer({textContentSource:tc,container:tl,viewport:vp,textDivs:[]});
    await r.promise;
  }catch(e){console.warn('PDF text layer:',e&&e.message||e)}
}
function go(n){
  if(!pdf)return 0;

}

function settleImages(root){
  const imgs=[...root.querySelectorAll('img')].filter(i=>!i.complete);
  if(!imgs.length)return Promise.resolve();
  return new Promise(res=>{
    let n=imgs.length,done=false,t=0;
    const fin=()=>{if(done)return;done=true;clearTimeout(t);res()};
    t=setTimeout(fin,1800);
    imgs.forEach(i=>{i.addEventListener('load',()=>{if(--n<=0)fin()},{once:true});i.addEventListener('error',()=>{if(--n<=0)fin()},{once:true})});
  });
}
async function loadSec(i,opt){
  if(!book||!secs.length)return false;
  i=clamp(i,0,secs.length-1);ci=i;hidePop();opt=opt||{};
  const v=$('#epubView');
  v.innerHTML='<div class="ebody"><span class="mu">Yüklənir…</span></div>';
  let html;
  try{html=await secs[i].render(book.load.bind(book))}
  catch(e){v.innerHTML='<div class="ebody">Fəsil açılmadı: '+esc(e&&e.message||e)+'</div>';return false}
  if(!cur||cur.type!=='epub'||!book)return false;
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('script,style,link,meta,title,iframe,object,embed,form').forEach(n=>n.remove());
  doc.querySelectorAll('[style]').forEach(n=>n.removeAttribute('style'));
  doc.querySelectorAll('[onclick],[onload],[onerror]').forEach(n=>{n.removeAttribute('onclick');n.removeAttribute('onload');n.removeAttribute('onerror')});
  const box=document.createElement('div');box.className='ebody';
  box.innerHTML=doc.body?doc.body.innerHTML:'';
  box.querySelectorAll('a[href]').forEach(a=>{
    a.addEventListener('click',ev=>{ev.preventDefault();followHref(a.getAttribute('href'))});
  });
  v.replaceChildren(box);
  applyTextStyle();
  await settleImages(box);
  if(!cur||cur.type!=='epub')return false;
  if(opt.anchor)scrollToAnchor(box,opt.anchor);
  else if(opt.pos)scrollToSaved(v,opt.pos);
  else if(opt.end)v.scrollTop=v.scrollHeight;
  else v.scrollTop=0;

}
const normPath=p=>decodeURIComponent(String(p||'')).replace(/#.*$/,'').replace(/^\.\//,'').replace(/^\/+/,'').toLowerCase();
function absPath(base,rel){
  try{const u=new URL(rel,'http://x/'+String(base||'').replace(/^\/+/,''));return normPath(u.pathname)}catch{return normPath(rel)}
}
function findSection(path){
  let i=secs.findIndex(s=>normPath(s.href)===path);
  if(i<0){const b=path.split('/').pop();i=secs.findIndex(s=>normPath(s.href).split('/').pop()===b)}
  return i;
}
function scrollToAnchor(box,anchor){
  if(!anchor)return;
  const want=decodeURIComponent(String(anchor).replace(/^#/,''));
  const el=[...box.querySelectorAll('[id],[name]')].find(e=>e.id===want||e.getAttribute('name')===want);
  if(!el)return;
  const v=$('#epubView');
  const top=el.getBoundingClientRect().top-v.getBoundingClientRect().top+v.scrollTop-10;
  v.scrollTop=Math.max(0,top);
}
function followHref(href){
  if(!href||/^(https?:|mailto:|tel:|data:|javascript:)/i.test(href))return;
  const raw=String(href),hashIdx=raw.indexOf('#');
  const path=hashIdx<0?raw:raw.slice(0,hashIdx);
  const hash=hashIdx<0?'':raw.slice(hashIdx+1);
  if(!cur)return;
  if(!path){const box=$('#epubView .ebody');if(box)scrollToAnchor(box,hash);return}
  const want=absPath(secs[ci]&&secs[ci].href||'',path);
  let idx=findSection(want);
  if(idx<0)idx=findSection(normPath(path));
  if(idx<0)return;
  if(idx===ci){const box=$('#epubView .ebody');if(box&&hash)scrollToAnchor(box,hash)}
  else loadSec(idx,{anchor:hash||null});
}
function tocList(){
  const src=book&&book.navigation&&book.navigation.toc||[],out=[];
  const walk=(arr,d)=>{
    for(const it of arr||[]){
      const lab=htmlText(it.label)||'Bölmə';
      out.push({label:lab,href:it.href||'',d});
      if(it.subitems&&it.subitems.length)walk(it.subitems,d+1);
    }
  };
  walk(src,0);return out;
}
async function epubIndex(){
  if(epubIdx&&epubIdx.length===secs.length)return epubIdx;
  if(epubIdxBusy)return epubIdxBusy;
  const bk=book;
  epubIdxBusy=(async()=>{
    const out=[];
    for(let i=0;i<secs.length;i++){
      if(!book||book!==bk)break;
      try{
        const root=await secs[i].load(bk.load.bind(bk));
        let t='';
        if(root){
          let c=root;
          try{c=root.cloneNode(true);c.querySelectorAll('head,style,script,title').forEach(n=>n.remove())}catch{}
          t=c.textContent||'';
        }
        out.push({i,text:t.replace(/\s+/g,' ').trim()});
        secs[i].unload&&secs[i].unload();
      }catch{}
    }
    epubIdx=out;epubIdxBusy=null;return out;
  })();
  return epubIdxBusy;
}

const HRE=/^(fəsil|bölmə|hissə|kitab|proloq|epiloq|chapter|part|book|prologue|epilogue|глава|часть|capítulo|capitolo|kapitel|chapitre)\b/i;
function isHeading(l){
  if(!l||l.length>90)return false;
  if(HRE.test(l))return true;
  if(/^[IVXLC]{1,6}[.)]?$/.test(l))return true;
  if(/^\d{1,3}[.)]?\s+\S/.test(l)&&l.length<70)return true;
  const letters=l.replace(/[^\p{L}]/gu,'');
  if(letters.length>=3&&letters.length<=60&&letters===letters.toUpperCase()&&/\p{Lu}/u.test(letters))return true;
  return false;
}
function parseTxt(text){
  const lines=String(text).replace(/\r\n?/g,'\n').split('\n'),paras=[];let buf=[];
  const flush=()=>{if(buf.length){const t=buf.join(' ').trim();if(t)paras.push({t,h:false});buf=[]}};
  for(const raw of lines){
    const l=raw.trim();
    if(!l){flush();continue}
    if(isHeading(l)){flush();paras.push({t:l,h:true});continue}
    buf.push(l);
  }
  flush();
  return paras.length?paras:[{t:String(text).trim()||'(boş fayl)',h:false}];
}
async function openTxt(b){
  const text=await b.blob.text();

  txt={paras,els:[],shown:0,toc:paras.map((p,i)=>p.h?{i,label:p.t}:null).filter(Boolean)};
  const pos=LS('pos:'+b.id,null);
  const target=pos&&typeof pos==='object'?pos:null;
  const need=target?Math.min(paras.length,(+target.pi||0)+40):90;
  txtAppend(Math.max(60,need));
  v.onscroll=()=>{
    hidePop();
    if(!txt)return;
    if(v.scrollTop+v.clientHeight>v.scrollHeight-700&&txt.shown<txt.paras.length)txtAppend(250);
    if(!onTxtScroll.raf)onTxtScroll.raf=requestAnimationFrame(()=>{onTxtScroll.raf=0;progT();saveTxtPos()});
  };
  await new Promise(r=>requestAnimationFrame(r));
  if(target){

async function pdfOutline(){

          let dest=it.dest;
          if(typeof dest==='string')dest=await pdf.getDestination(dest);
          if(Array.isArray(dest)&&dest[0])page=(await pdf.getPageIndex(dest[0]))+1;

}

const WRE=/[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu;
const cache={};
function chunk(text,n){const parts=String(text).match(/[^.!?]+[.!?]*\s*/g)||[text],ch=[];let c='';for(const p of parts){if((c+p).length>n&&c){ch.push(c);c=p}else c+=p}if(c)ch.push(c);return ch}
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
let S=null,hl=[],ps=null,lastShow=0;
const cs=e=>getComputedStyle(e).display;
function build(unit,isPdf){
  if(unit._b)return unit._b;
  const segs=[];let text='';
  if(isPdf){
    const items=[...unit.children].filter(e=>e.firstChild&&e.firstChild.nodeType===3).map(e=>({e,b:e.getBoundingClientRect()})),lines=[];
    for(const o of items){
      const cy=(o.b.top+o.b.bottom)/2,L=lines.find(l=>Math.abs(cy-l.cy)<Math.max(o.b.height,l.h)*.45);
      if(L)L.it.push(o);else lines.push({cy,h:o.b.height,it:[o]});
    }
    for(const L of lines){
      L.it.sort((a,b)=>a.b.left-b.b.left);
      if(text&&!/\s$/.test(text))text+=' ';
      let prev=null;
      for(const o of L.it){
        const t=o.e.textContent;
        if(prev&&o.b.left-prev.b.right>L.h*.2&&!/\s$/.test(text)&&!/^\s/.test(t))text+=' ';
        segs.push({node:o.e.firstChild,start:text.length,len:t.length});text+=t;prev=o;
      }
    }
  }else{
    const walk=n=>{for(const c of n.childNodes){
      if(c.nodeType===3){segs.push({node:c,start:text.length,len:c.data.length});text+=c.data}
      else if(c.nodeType===1){
        if(c.tagName==='BR'){text+=' ';continue}
        const d=cs(c);
        if(d.startsWith('inline')||d==='contents')walk(c);
      }
    }};
    walk(unit);
  }
  const words=[...text.matchAll(WRE)].map(m=>({s:m.index,e:m.index+m[0].length}));
  return unit._b={text,segs,words};
}
function pick(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const layer=el.closest('.textLayer');if(layer&&el===layer)return null;
  let node=null,off=0;
  const scan=n=>{
    if(!n.data)return false;
    const nr=document.createRange();nr.selectNodeContents(n);const b=nr.getBoundingClientRect();
    if(x<b.left-8||x>b.right+8||y<b.top-8||y>b.bottom+8)return false;
    for(const m of n.data.matchAll(WRE)){
      const r=document.createRange();r.setStart(n,m.index);r.setEnd(n,m.index+m[0].length);
      for(const q of r.getClientRects())if(x>=q.left-4&&x<=q.right+4&&y>=q.top-4&&y<=q.bottom+4){node=n;off=m.index;return true}
    }
    return false;
  };
  const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  while(tw.nextNode())if(scan(tw.currentNode))break;
  if(!node)return null;
  let unit=layer;
  if(!unit){unit=node.parentElement;while(unit&&cs(unit).startsWith('inline'))unit=unit.parentElement}
  if(!unit)return null;
  const c=build(unit,!!layer),sg=c.segs.find(g=>g.node===node);if(!sg)return null;
  const idx=sg.start+off,i=c.words.findIndex(w=>idx>=w.s&&idx<w.e);
  return i<0?null:{unit,c,i};
}
const union=rs=>rs.reduce((a,b)=>({left:Math.min(a.left,b.left),right:Math.max(a.right,b.right),top:Math.min(a.top,b.top),bottom:Math.max(a.bottom,b.bottom)}),{left:1e9,right:-1e9,top:1e9,bottom:-1e9});
function selRects(c,s,e){
  const out=[];
  for(const g of c.segs){
    const a=Math.max(s,g.start),z=Math.min(e,g.start+g.len);
    if(a<z){const r=document.createRange();r.setStart(g.node,a-g.start);r.setEnd(g.node,z-g.start);out.push(...r.getClientRects())}
  }
  return out;
}
function highlight(rects){
  clearHL();
  hl=[...rects].map(r=>{
    const e=document.createElement('div');
    e.style.cssText='position:fixed;left:'+(r.left-1)+'px;top:'+r.top+'px;width:'+(r.width+2)+'px;height:'+r.height+'px;background:rgba(242,193,78,.45);border-radius:3px;pointer-events:none;z-index:4';
    document.body.append(e);return e;
  });
}
function clearHL(){hl.forEach(e=>e.remove());hl=[]}
function hidePop(){$('#pop').hidden=true;ps=null;S=null;clearHL()}
function show(anchor){
  const c=S.unit._b,w=c.words,s=w[S.a].s,e=w[S.b].e;
  const txt=c.text.slice(s,e).replace(/\s+/g,' ').trim();
  if(!txt)return;
  const rects=selRects(c,s,e);if(!rects.length)return;
  highlight(rects);
  const a=c.text.slice(0,s),z=c.text.slice(e);
  const st=Math.max(a.lastIndexOf('. '),a.lastIndexOf('! '),a.lastIndexOf('? '))+1;
  let en=z.search(/[.!?]/);en=en<0?c.text.length:e+en+1;
  showPop(txt,union(rects),c.text.slice(st,en).trim());
}
function tap(e){
  const h=pick(e.clientX,e.clientY);
  if(!h){if(ps)hidePop();else toggleFocus();return}
  if(ps&&S&&S.unit===h.unit){
    if(h.i>S.b)S.b=h.i;else if(h.i<S.a)S.a=h.i;
    else if(S.a<S.b&&h.i===S.b)S.b--;else if(S.a<S.b&&h.i===S.a)S.a++;
    else{hidePop();return}
    show(h.i);return;
  }
  if(ps){hidePop();return}
  S={unit:h.unit,a:h.i,b:h.i};show(h.i);
}
let focusHinted=false;
function toggleFocus(){
  const on=document.body.classList.toggle('focus');
  if(on&&!focusHinted){focusHinted=true;toast('Fokus rejimi — çıxmaq üçün boş yerə toxun',2600)}

const pickEx=x=>[x.ctx,...(x.exs||[])].find(t=>t&&t.length<230&&wre(x.w).test(t));
function mkQ(x){

  const t=(b<=1?['tr','def','rev']:b<=3?['cloze','rev','tr','def']:['type','cloze','rev','tr']).find(k=>k==='type'?typeOk:av[k])||'type';

function runQuiz(items,o){

      '<div class="fb"><button class="fill" id="a1">Yenidən</button><button id="a2">Lüğətə qayıt</button></div></div>';
    $('#a1').onclick=()=>startQuiz(o);

  const step=()=>{

    $('#qe').onclick=()=>{clearQuizKeys();renderDict()};
    const fin=correct=>{
      if(!first.has(x)){
        first.add(x);
        if(correct){ok++;x.box=Math.min((x.box||0)+1,5);x.due=Date.now()+IV_DAYS[x.box]*864e5;streak++;best=Math.max(best,streak)}

    };

      Q.opts.forEach((t,i)=>{
        const b=el('button','opt','<b>'+'ABCD'[i]+'</b>&nbsp; '+esc(t));b.dataset.t=t;
        b.onclick=()=>{

async function readBook(b,add,prog){
  if(b.type==='txt'){add(await b.blob.text());return}
  if(b.type==='pdf'){
    const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;
    for(let i=1;i<=d.numPages&&job&&!job.stop;i++){
      const t=await(await d.getPage(i)).getTextContent();
      add(t.items.map(x=>x.str).join(' '));prog(i+'/'+d.numPages);
    }
    return;
  }
  await needEpub();
  const bk=ePub(await b.blob.arrayBuffer(),{openAs:'binary'});await bk.ready;
  let i=0;
  for(const sc of bk.spine.spineItems){
    if(!job||job.stop)break;
    try{
      const c=await sc.load(bk.load.bind(bk));
      c.querySelectorAll('style,script').forEach(e=>e.remove());
      add(c.textContent||'');
      sc.unload&&sc.unload();
    }catch{}
    prog(++i+'/'+bk.spine.spineItems.length);
  }
  try{bk.destroy()}catch{}
}
async function trBatch(ws,src,dst){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+(src==='Autodetect'?'auto':src)+'&tl='+dst+'&q='+encodeURIComponent(ws.join('\n')));
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(),T=(j[0]||[]).map(x=>x[0]).join('').split('\n').map(x=>x.trim());
  while(T.length&&!T[T.length-1])T.pop();
  if(T.length!==ws.length){
    if(ws.length===1)return T[0]?{[ws[0]]:T[0]}:{};
    const h=ws.length>>1;
    return Object.assign(await trBatch(ws.slice(0,h),src,dst),await trBatch(ws.slice(h),src,dst));
  }
  const o={};ws.forEach((w,i)=>{if(T[i])o[w]=T[i]});return o;
}
async function makePack(b){
  if(job)return;
  const src=cfg.src,dst=cfg.dst;
  if(src===dst){alert('Mənbə və tərcümə dili eyni ola bilməz.');return}
  job={id:b.id,txt:'Mətn oxunur…',stop:false};
  renderLib();
  let fail=null;
  const upd=()=>{const e=document.querySelector('.jp');if(e&&job)e.textContent=job.txt};
  try{
    const cnt=new Map();
    await readBook(b,t=>{
      for(const m of t.matchAll(WRE)){const w=m[0].toLowerCase();if(w.length>1&&w.length<31)cnt.set(w,(cnt.get(w)||0)+1)}
    },x=>{if(job){job.txt='Mətn oxunur… '+x;upd()}});
    const words=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,15000),batches=[];
    for(let i=0;i<words.length;){
      let n=0,len=0;
      while(i+n<words.length&&n<250&&len+words[i+n].length+1<1300){len+=words[i+n].length+1;n++}
      batches.push(words.slice(i,i+n));i+=n;
    }
    const map={};let bi=0,done=0;
    const worker=async()=>{
      while(bi<batches.length&&job&&!job.stop&&!fail){
        const bt=batches[bi++];
        try{Object.assign(map,await trBatch(bt,src,dst))}catch(e){fail=e}
        done+=bt.length;
        if(job){job.txt='Tərcümə… '+Math.round(done/Math.max(1,words.length)*100)+'% ('+Object.keys(map).length+' söz)';upd()}
      }
    };
    await Promise.all([worker(),worker(),worker()]);
    const n=Object.keys(map).length;
    if(n){
      const p={id:b.id,name:b.name,src,dst,n,date:Date.now(),map,partial:!!(fail||(job&&job.stop))};
      await idb('readwrite',x=>x.put(p),'packs');packIdx[b.id]=p;
      toast('Oflayn paket hazır: '+n+' söz');
    }else if(fail)alert('Alınmadı. İnternet bağlantısını yoxla və yenidən cəhd et.');
  }catch(e){alert('Xəta: '+(e.message||e))}
  job=null;renderLib();
}

async function ttsRun(id){
  let first=true;
  while(tts&&tts.id===id){
    const items=ttsItems();
    if(!items.length)break;
    let start=0;
    if(first){start=firstVisible(items);if(cur&&cur.type==='txt')tts.ti=start}
    else if(cur&&cur.type==='txt')start=tts.ti||0;
    for(let i=start;i<items.length;i++){
      if(!tts||tts.id!==id)return;
      const it=items[i];
      if(it.el){
        it.el.classList.add('tts');
        const vp=cur&&cur.type==='epub'?$('#epubView'):cur&&cur.type==='txt'?$('#txtView'):null;
        if(vp)scrollEl(vp,it.el);
      }
      for(const c of chunk(it.text,280)){if(!tts||tts.id!==id)break;await speakOnce(c)}
      if(it.el)it.el.classList.remove('tts');
    }
    first=false;
    if(!tts||tts.id!==id)return;
    if(cur.type==='pdf'){if(pg>=pdf.numPages)break;pg++;await renderPdf()}
    else if(cur.type==='epub'){if(ci+1>=secs.length)break;await loadSec(ci+1)}
    else{
      if(cur.type==='txt'&&txt&&txt.shown<txt.paras.length){tts.ti=txt.shown;txtAppend(60);await sleep(120);continue}
      break;
    }
    await sleep(220);
  }
  if(tts&&tts.id===id)ttsStop();
}

function swipeBind(el){
  if(!el)return;
  let x0=null,y0=0;
  el.addEventListener('touchstart',e=>{
    const t=e.touches[0];x0=t.clientX;y0=t.clientY;
    if(x0<24||x0>innerWidth-24)e.preventDefault();
  },{passive:false});
  el.addEventListener('touchend',e=>{
    if(x0==null)return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)*1.2){hidePop();dx<0?next():prev()}
  },{passive:true});
  el.addEventListener('touchcancel',()=>{x0=null},{passive:true});
}
['#epubView','#pdfView','#txtView'].forEach(q=>swipeBind($(q)));

/* ================= 22. OXUMA VAXTI, ÖLÇÜ, GİZLİNMƏ ================= */
let lastAct=Date.now();
['pointerdown','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
document.addEventListener('scroll',()=>lastAct=Date.now(),true);
setInterval(()=>{
  if(!cur||$('#reader').hidden||document.hidden)return;
  if(Date.now()-lastAct>90000&&!tts)return;
  const k='time:'+cur.id;SV(k,LS(k,0)+5);SV(today(),LS(today(),0)+5);
},5000);
let rzT=0,lastW=innerWidth;
addEventListener('resize',()=>{
  if(ps)place();
  const w=innerWidth;
  if(cur&&cur.type==='pdf'&&Math.abs(w-lastW)>40){
    lastW=w;clearTimeout(rzT);rzT=setTimeout(()=>{if(cur&&cur.type==='pdf')renderPdf()},350);
  }else lastW=w;
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(cur&&cur.type==='epub')saveEbookPos();if(cur&&cur.type==='txt')saveTxtPos();if(tts)ttsStop()}
});
addEventListener('pagehide',()=>{if(cur&&cur.type==='epub')saveEbookPos();if(cur&&cur.type==='txt')saveTxtPos()});

/* ================= 23. EPUB MÜHƏRRİKİ YÜKLƏ ================= */
const scriptCache={};
function loadScript(u){
  if(scriptCache[u])return scriptCache[u];
  scriptCache[u]=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=u;
    s.onload=()=>res();s.onerror=()=>rej(new Error('Yüklənmədi: '+u));
    document.head.append(s);
  });
  return scriptCache[u];
}
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';

/* ================= 24. SERVICE WORKER ================= */
let swReg=null,reloading=false;
const hadController=('serviceWorker'in navigator)&&!!navigator.serviceWorker.controller;
function showUpdate(){
  toast('Yeni versiya hazır',15000,{label:'Yenilə',fn:()=>{
    if(swReg&&swReg.waiting)swReg.waiting.postMessage({type:'SKIP_WAITING'});
    else location.reload();
  }});
}
function registerSW(){
  if(!('serviceWorker'in navigator)||!location.protocol.startsWith('http'))return;
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)showUpdate()});
    });
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloading)return;
    reloading=true;location.reload();
  });
}

/* ================= 25. BAŞLAT ================= */
applyTheme();count();updRate();
loadPacks().then(renderLib);
registerSW();
$('#bAdd').textContent='+ Kitab əlavə et';
if(!navigator.onLine)toast('Oflayn rejim — yüklənmiş kitablar işləyəcək',3500);
</script>
