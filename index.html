<script>
const $=s=>document.querySelector(s);

let cfg=Object.assign({src:'Autodetect',dst:'az',size:110,dark:false,theme:'',font:'serif',dim:0,margin:0},LS('cfg',{}));
if(!cfg.theme)cfg.theme=cfg.dark?'dark':'light';
if(!cfg.mv){cfg.margin=0;cfg.mv=1;SV('cfg',cfg)}

const THEMES=[['light','Açıq'],['sepia','Sepia (isti krem)'],['dark','Tünd boz'],['black','Gecə (qara)']];
const LANGS=[['Autodetect','Avtomatik'],['en','English'],['tr','Türkçe'],['ru','Русский'],['de','Deutsch'],['fr','Français'],['es','Español'],['it','Italiano'],['ar','العربية'],['az','Azərbaycanca']];
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- storage (IndexedDB) ---------- */
const db=new Promise((res,rej)=>{const r=indexedDB.open('oxu',2);r.onupgradeneeded=()=>{const d=r.result;for(const n of ['books','packs'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f,st='books')=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction(st,m);const o=f(t.objectStore(st));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)})};
const packIdx={};
async function loadPacks(){try{(await tx('readonly',x=>x.getAll(),'packs')).forEach(p=>packIdx[p.id]=p)}catch{}}

/* ---------- views ---------- */
function view(n){['lib','reader','dict'].forEach(v=>$('#'+v).hidden=v!==n);hidePop();if(n!=='reader'){$('#title').textContent='Oxu';document.body.classList.remove('focus')}
 document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));if(n==='lib')$('#bBack').classList.add('on');if(n==='dict')$('#bDict').classList.add('on')}
let libQ='',libF=LS('libF','all'),libS=LS('libS','recent');
const fmt=sec=>{const m=Math.round(sec/60);return m<60?m+' dəq':Math.floor(m/60)+' s '+(m%60)+' dəq'};
const today=()=>'day:'+new Date().toLocaleDateString('sv');
const prg=b=>LS('prg:'+b.id,0),opn=b=>LS('open:'+b.id,0);
function posText(b){const q=LS('pos:'+b.id,null);if(b.type==='epub'&&q&&typeof q==='object')return 'Fəsil '+(q.i+1);if(b.type==='pdf'&&typeof q==='number')return 'Səhifə '+q;return''}
function meta(b){const p=prg(b),t=LS('time:'+b.id,0),a=[b.type.toUpperCase(),(b.blob.size/1048576).toFixed(1)+' MB'];
 if(p>0)a.push(Math.round(p*100)+'%');if(t>=60)a.push('oxuma: '+fmt(t));if(t>=300&&p>.02&&p<.97)a.push('qalan ≈ '+fmt(t*(1-p)/p));return a.join(' · ')}
function coverHtml(b){const c=LS('cover:'+b.id,null);if(c&&c!=='none')return `<img src="${c}" alt="">`;

 return `<div class="ph" style="background:linear-gradient(150deg,hsl(${h},42%,40%),hsl(${(h+40)%360},48%,22%))"><b>${esc(b.name.trim().charAt(0).toUpperCase()||'?')}</b><small>${b.type.toUpperCase()}</small></div>`}
async function makeCover(b){
 const W=160,cv=document.createElement('canvas');
 if(b.type==='pdf'){const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise,pg1=await d.getPage(1),v0=pg1.getViewport({scale:1}),vp=pg1.getViewport({scale:W/v0.width});
  cv.width=vp.width;cv.height=vp.height;await pg1.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;try{d.destroy()}catch{}return cv.toDataURL('image/jpeg',.7)}
 if(b.type==='epub'){await needEpub();const bk=ePub(await b.blob.arrayBuffer(),{openAs:'binary'});await bk.ready;
  const u=await bk.coverUrl();if(!u){try{bk.destroy()}catch{}return null}
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
  cv.width=W;cv.height=Math.round(img.naturalHeight*W/img.naturalWidth);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);try{bk.destroy()}catch{}return cv.toDataURL('image/jpeg',.7)}
 return null}
let covBusy=false;
async function genCovers(list){
 if(covBusy)return;covBusy=true;
 for(const b of list){if(LS('cover:'+b.id,null)!==null)continue;let u;try{u=await makeCover(b)}catch{continue}
  SV('cover:'+b.id,u||'none');document.querySelectorAll(`[data-cv="${b.id}"]`).forEach(e=>e.innerHTML=coverHtml(b))}

function renderStats(list){
 let tot=0;list.forEach(b=>tot+=LS('time:'+b.id,0));
 $('#stats').innerHTML=[[list.length,'kitab'],[list.filter(b=>prg(b)>=.97).length,'oxunub'],[dict.length,'söz lüğətdə'],
  [dict.filter(x=>(x.box||0)>=3).length,'öyrənilib'],[fmt(LS(today(),0)),'bu gün'],[fmt(tot),'ümumi vaxt']].map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join('')}
async function renderLib(){
 const all=await tx('readonly',s=>s.getAll());renderStats(all);
 /* oxumağa davam et */

 if(b.type==='pdf'){const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;
  for(let i=1;i<=d.numPages&&!job.stop;i++){const t=await(await d.getPage(i)).getTextContent();add(t.items.map(x=>x.str).join(' '));prog(i+'/'+d.numPages)}return}

  prog(++i+'/'+bk.spine.spineItems.length)}

async function trBatch(ws,src,dst){
 const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+(src==='Autodetect'?'auto':src)+'&tl='+dst+'&q='+encodeURIComponent(ws.join('\n')));
 if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json(),T=(j[0]||[]).map(x=>x[0]).join('').split('\n').map(x=>x.trim());
 while(T.length&&!T[T.length-1])T.pop();
 if(T.length!==ws.length){
  if(ws.length===1)return T[0]?{[ws[0]]:T[0]}:{};
  const h=ws.length>>1;return Object.assign(await trBatch(ws.slice(0,h),src,dst),await trBatch(ws.slice(h),src,dst))}
 const o={};ws.forEach((w,i)=>{if(T[i])o[w]=T[i]});return o;
}
async function makePack(b){
 if(job)return;const src=cfg.src,dst=cfg.dst;
 if(src===dst){alert('Mənbə və tərcümə dili eyni ola bilməz (⚙).');return}
 job={id:b.id,txt:'Mətn oxunur…',stop:false};renderLib();
 let fail=null;
 try{
  const cnt=new Map();
  await readBook(b,t=>{for(const m of t.matchAll(WRE)){const w=m[0].toLowerCase();if(w.length>1&&w.length<31)cnt.set(w,(cnt.get(w)||0)+1)}},x=>{job.txt='Mətn oxunur… '+x;upd()});
  const words=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,15000),batches=[];
  for(let i=0;i<words.length;){let n=0,len=0;while(i+n<words.length&&n<250&&len+words[i+n].length+1<1300){len+=words[i+n].length+1;n++}batches.push(words.slice(i,i+n));i+=n}
  const map={};let bi=0,done=0;
  const worker=async()=>{while(bi<batches.length&&!job.stop&&!fail){const bt=batches[bi++];
   try{Object.assign(map,await trBatch(bt,src,dst))}catch(e){fail=e}
   done+=bt.length;job.txt='Tərcümə olunur… '+Math.round(done/words.length*100)+'% ('+Object.keys(map).length+' söz)';upd()}};
  await Promise.all([worker(),worker(),worker()]);
  const n=Object.keys(map).length;
  if(n){const p={id:b.id,name:b.name,src,dst,n,date:Date.now(),map,partial:!!(fail||job.stop)};await tx('readwrite',x=>x.put(p),'packs');packIdx[b.id]=p}
  else if(fail)alert('Alınmadı. İnternet bağlantısını yoxla və yenidən cəhd et.');
 }catch(e){alert('Xəta: '+(e.message||e))}
 job=null;renderLib();
}

const WRE=/[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu;
let S=null;
const cs=e=>getComputedStyle(e).display;
function build(unit,pdf){

 if(pdf){
  const items=[...unit.children].filter(e=>e.firstChild&&e.firstChild.nodeType===3).map(e=>({e,b:e.getBoundingClientRect()})),lines=[];
  for(const o of items){const cy=(o.b.top+o.b.bottom)/2,L=lines.find(l=>Math.abs(cy-l.cy)<Math.max(o.b.height,l.h)*.45);
   if(L)L.it.push(o);else lines.push({cy,h:o.b.height,it:[o]})}
  for(const L of lines){L.it.sort((a,b)=>a.b.left-b.b.left);if(text&&!/\s$/.test(text))text+=' ';let prev=null;
   for(const o of L.it){const t=o.e.textContent;
    if(prev&&o.b.left-prev.b.right>L.h*.2&&!/\s$/.test(text)&&!/^\s/.test(t))text+=' ';
    segs.push({node:o.e.firstChild,start:text.length,len:t.length});text+=t;prev=o}}
 }else{
  const walk=n=>{for(const c of n.childNodes){
   if(c.nodeType===3){segs.push({node:c,start:text.length,len:c.data.length});text+=c.data}
   else if(c.nodeType===1){if(c.tagName==='BR'){text+=' ';continue}const d=cs(c);if(d.startsWith('inline')||d==='contents')walk(c)}}};
  walk(unit);

}
function pick(x,y){
 const el=document.elementFromPoint(x,y);if(!el)return;
 const layer=el.closest('.textLayer');if(layer&&el===layer)return;

 const scan=n=>{
  const nr=document.createRange();nr.selectNodeContents(n);const b=nr.getBoundingClientRect();
  if(x<b.left-6||x>b.right+6||y<b.top-6||y>b.bottom+6)return false;
  for(const m of n.data.matchAll(WRE)){const r=document.createRange();r.setStart(n,m.index);r.setEnd(n,m.index+m[0].length);
   for(const q of r.getClientRects())if(x>=q.left-3&&x<=q.right+3&&y>=q.top-3&&y<=q.bottom+3){node=n;off=m.index;return true}}
  return false};

 while(tw.nextNode())if(scan(tw.currentNode))break;

 if(!unit)return;
 const c=build(unit,!!layer),sg=c.segs.find(g=>g.node===node);if(!sg)return;

const union=rs=>rs.reduce((a,b)=>({left:Math.min(a.left,b.left),right:Math.max(a.right,b.right),top:Math.min(a.top,b.top),bottom:Math.max(a.bottom,b.bottom)}),{left:1e9,right:-1e9,top:1e9,bottom:-1e9});
function show(anchor){

 const txt=c.text.slice(s,e).replace(/\s+/g,' ').trim();

 const a=c.text.slice(0,s),z=c.text.slice(e),st=Math.max(a.lastIndexOf('. '),a.lastIndexOf('! '),a.lastIndexOf('? '))+1;

function tap(e){

 if(ps&&S&&S.unit===h.unit){                           /* eyni abzasda başqa sözə toxun → aradakı hamısı seçilir */
  if(h.i>S.b)S.b=h.i;else if(h.i<S.a)S.a=h.i;
  else if(S.a<S.b&&h.i===S.b)S.b--;else if(S.a<S.b&&h.i===S.a)S.a++;
  else{hidePop();return}
  show(h.i);return}

let hl=[];
function highlight(d,rects){clearHL();hl=[...rects].map(r=>{const e=d.createElement('div');
 e.style.cssText=`position:fixed;left:${r.left-1}px;top:${r.top}px;width:${r.width+2}px;height:${r.height}px;background:rgba(242,193,78,.5);border-radius:3px;pointer-events:none;z-index:5`;
 d.body.append(e);return e})}

/* ---------- tərcümə: Google (gtx) + ehtiyat olaraq MyMemory ---------- */
const cache={},dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
function chunk(text,n){const parts=text.match(/[^.!?]+[.!?]*\s*/g)||[text],ch=[];let c='';
 for(const p of parts){if((c+p).length>n&&c){ch.push(c);c=p}else c+=p}if(c)ch.push(c);return ch}
async function gtr(text){
 const sl=cfg.src==='Autodetect'?'auto':cfg.src;let t='',alts=[],src='';
 for(const [i,x] of chunk(text,1400).entries()){
  const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&dt=bd&hl='+cfg.dst+'&sl='+sl+'&tl='+cfg.dst+'&q='+encodeURIComponent(x.trim()));
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
  const part=(j[0]||[]).map(a=>a[0]).join('');if(!part)throw new Error('empty');
  t+=(i?' ':'')+part;if(i===0){alts=(j[1]||[]).map(g=>({pos:g[0],w:(g[1]||[]).slice(0,5)}));src=typeof j[2]==='string'?j[2]:''}}
 return{t,alts,src};
}
async function mm(text){
 const out=await Promise.all(chunk(text,450).map(async x=>{
  const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(x.trim())+'&langpair='+cfg.src+'|'+cfg.dst);
  const j=await r.json();if(+j.responseStatus!==200)throw new Error(j.responseDetails);return dec(j.responseData.translatedText)}));
 return{t:out.join(' '),alts:[],src:''};
}
let tc=LS('tcache',{});
function saveTc(k,v){tc[k]=v;const ks=Object.keys(tc);if(ks.length>2500)ks.slice(0,500).forEach(x=>delete tc[x]);
 try{SV('tcache',tc)}catch{ks.slice(0,ks.length/2).forEach(x=>delete tc[x]);try{SV('tcache',tc)}catch{}}}
async function tr(text){
 const k=cfg.src+'|'+cfg.dst+'|'+(/\s/.test(text)?text:text.toLowerCase());
 if(cache[k])return cache[k];if(tc[k])return cache[k]=tc[k];
 if(!navigator.onLine){const o=packLookup(text);if(o)return{t:o,alts:[],src:'',off:true}}
 let res;
 try{res=await gtr(text)}catch{try{res=await mm(text)}catch{
  const o=packLookup(text);if(o)return{t:o,alts:[],src:'',off:true};
  const d=dict.find(x=>x.w.toLowerCase()===text.toLowerCase());
  if(d)return{t:d.t,alts:[],src:d.lang||''};
  throw new Error(navigator.onLine?'Tərcümə alınmadı':'offline')}}
 saveTc(k,res);return cache[k]=res;
}

let ps=null,lastShow=0;
function showPop(text,rect,fr,ctx){
 lastShow=Date.now();
 const o=fr?fr.getBoundingClientRect():{left:0,top:0};
 ps={text,ctx,t:'',r:{l:rect.left+o.left,rt:rect.right+o.left,tp:rect.top+o.top,b:rect.bottom+o.top}};
 $('#pw').textContent=text;$('#pt').textContent='…';$('#pm').textContent='';$('#pop').hidden=false;starState();place();
 tr(text).then(r=>{if(!ps||ps.text!==text)return;
  ps.t=r.t;ps.lang=r.src||(cfg.src!=='Autodetect'?cfg.src:'');if(ps.lang)lastLang=ps.lang;$('#pt').textContent=r.t;const m=[];
  if(r.off)m.push('Oflayn (kitab paketi)');
  if(cfg.src==='Autodetect'&&r.src){const L=LANGS.find(l=>l[0]===r.src);m.push('Dil: '+(L?L[1]:r.src))}
  if(!/\s/.test(text)&&r.alts.length)m.push(r.alts.map(a=>a.pos+': '+a.w.join(', ')).join('\n'));
  $('#pm').textContent=m.join('\n');place()})
 .catch(()=>{if(ps&&ps.text===text){$('#pt').textContent=navigator.onLine?'Tərcümə alınmadı. Dilləri ⚙ ilə yoxla və ya bir az sonra yenə cəhd et.':'İnternet yoxdur. Bu söz oflayn paketlərdə, əvvəlki tərcümələrdə və lüğətdə yoxdur.'}});
}
function place(){
 const p=$('#pop'),r=ps.r,w=p.offsetWidth,topLim=document.body.classList.contains('focus')?24:62,botLim=innerHeight-12;
 p.style.maxHeight='';let h=p.offsetHeight;
 const above=r.tp-8-topLim,below=botLim-(r.b+8),up=above>=h||above>=below,room=Math.max(110,up?above:below);
 if(h>room){p.style.maxHeight=room+'px';h=room}
 const l=Math.max(8,Math.min(innerWidth-w-8,(r.l+r.rt)/2-w/2)),t=up?r.tp-8-h:r.b+8;
 p.style.left=l+'px';p.style.top=Math.max(8,Math.min(innerHeight-h-8,t))+'px';
}

const key=s=>s.toLowerCase();
function starState(){const has=ps&&dict.some(d=>key(d.w)===key(ps.text));$('#pStar').textContent=has?'★ Lüğətdədir':'☆ Lüğətə əlavə et'}
$('#pStar').onclick=()=>{if(!ps)return;const i=dict.findIndex(d=>key(d.w)===key(ps.text));
 if(i>=0)dict.splice(i,1);else dict.unshift({w:ps.text,t:ps.t,lang:ps.lang||'',ctx:ps.ctx,book:cur?cur.name:'',date:Date.now()});
 SV('dict',dict);starState();count()};
$('#pX').onclick=hidePop;
$('#pSay').onclick=()=>ps&&say(ps.text,ps.lang);
let lastLang='';
function pickVoice(l){const vs=speechSynthesis.getVoices(),n=v=>v.lang.replace('_','-').toLowerCase();
 return vs.find(v=>n(v)===l.toLowerCase())||vs.find(v=>n(v).startsWith(l.toLowerCase().slice(0,2)))}
function say(t,lang){
 const l=(lang||(cfg.src==='Autodetect'?lastLang||'en':cfg.src)).replace('_','-');speechSynthesis.cancel();
 chunk(t,280).forEach(c=>{const u=new SpeechSynthesisUtterance(c);u.lang=l;const v=pickVoice(l);if(v)u.voice=v;speechSynthesis.speak(u)})}
const count=()=>$('#cnt').textContent=dict.length;

/* ---------- dictionary ---------- */
$('#bDict').onclick=()=>{view('dict');renderDict()};
let dq='';
const IV=[0,1,3,7,16,35],dueList=()=>dict.filter(x=>!x.due||x.due<=Date.now());
function renderDict(){
 const d=$('#dict');d.innerHTML='<h2 style="font:600 28px var(--serif);margin:8px 0 12px">Lüğətim</h2>';
 if(!dict.length){d.innerHTML+='<div class="empty">Boşdur. Oxuyarkən sözə toxun və “Lüğətə əlavə et” düyməsini bas.</div>';return}
 const bar=document.createElement('div');bar.className='dbar';
 bar.innerHTML=`<input id="dq" type="search" placeholder="Lüğətdə axtar…" value="${esc(dq)}"><button class="fill" id="bLearn">Öyrən (${dueList().length})</button><button id="bCsv" title="Anki üçün CSV">CSV</button>`;
 d.append(bar);const rows=document.createElement('div');d.append(rows);
 $('#bLearn').onclick=learn;$('#bCsv').onclick=exportCsv;
 const draw=()=>{rows.innerHTML='';const q=dq.toLowerCase();
  dict.filter(x=>!q||(x.w+' '+(x.t||'')+' '+(x.ctx||'')).toLowerCase().includes(q)).forEach(x=>{const r=document.createElement('div');r.className='row';
   r.innerHTML=`<div><b>${esc(x.w)}</b> — ${esc(x.t||'')}${x.ctx?`<i>${esc(x.ctx)}</i>`:''}${x.book?`<i>${esc(x.book)}</i>`:''}</div><button title="Səsləndir">🔊</button><button title="Sil">🗑</button>`;
   const [sp,del]=r.querySelectorAll('button');sp.onclick=()=>say(x.w,x.lang);
   del.onclick=()=>{dict.splice(dict.indexOf(x),1);SV('dict',dict);count();renderDict()};rows.append(r)})};
 $('#dq').oninput=e=>{dq=e.target.value;draw()};draw();
}
function learn(){
 const q=dueList().sort(()=>Math.random()-.5).slice(0,20),n0=q.length,miss=new Set();let ok=0;
 if(!n0){alert('Bu gün təkrarlanacaq söz yoxdur 🎉');return}
 const d=$('#dict'),step=flip=>{
  if(!q.length){d.innerHTML=`<div class="fc"><div class="fw">Bitdi!</div><p>${ok} / ${n0} söz ilk cəhddə düzgün oldu.</p><button class="fill" id="bk">Lüğətə qayıt</button></div>`;$('#bk').onclick=renderDict;return}
  const x=q[0];
  d.innerHTML=`<div class="fc"><div class="cn">${n0-new Set(q).size+1} / ${n0}</div><div class="fw">${esc(x.w)}</div>${flip?`<div class="ft">${esc(x.t||'')}</div>${x.ctx?`<i>${esc(x.ctx)}</i>`:''}<div class="fb"><button id="no">✗ Bilmədim</button><button class="fill" id="yes">✓ Bildim</button></div>`:'<div class="fb"><button class="fill" id="show">Tərcüməni göstər</button></div>'}<div class="fs"><button id="sp">🔊</button> <button id="ex">Çıx</button></div></div>`;
  $('#sp').onclick=()=>say(x.w,x.lang);$('#ex').onclick=renderDict;
  if(!flip){$('#show').onclick=()=>step(true);return}
  $('#yes').onclick=()=>{x.box=Math.min((x.box||0)+1,5);x.due=Date.now()+IV[x.box]*864e5;if(!miss.has(x))ok++;q.shift();SV('dict',dict);step(false)};
  $('#no').onclick=()=>{miss.add(x);x.box=0;x.due=Date.now();q.push(q.shift());SV('dict',dict);step(false)};
 };
 step(false);
}
function exportCsv(){
 const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 const csv=dict.map(x=>[x.w,x.t,x.ctx,x.book].map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='lugetim.csv';a.click()}

const fill=(el,skipAuto,val)=>{el.innerHTML=LANGS.filter(l=>!(skipAuto&&l[0]==='Autodetect')).map(l=>`<option value="${l[0]}"${l[0]===val?' selected':''}>${l[1]}</option>`).join('')};

/* ---------- Ucadan oxu (player) ---------- */
const RATES=[1,1.25,1.5,.8],sleep=ms=>new Promise(r=>setTimeout(r,ms));let tts=null,rIdx=0;
function ttsItems(){
 if(cur.type==='pdf'){const l=document.querySelector('#pdfView .textLayer');if(!l)return[];const t=build(l,true).text.replace(/\s+/g,' ').trim();return t?[{text:t}]:[]}
 const root=cur.type==='epub'?document.querySelector('.ebody'):$('#txtView');if(!root)return[];
 let els=[...root.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre')].filter(e=>!e.querySelector('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre'));
 if(!els.length)els=[root];
 return els.map(el=>({el,text:el.textContent.replace(/\s+/g,' ').trim()})).filter(x=>x.text.length>1)}
function firstVisible(items){if(cur.type==='pdf')return 0;const top=$(cur.type==='epub'?'#epubView':'#txtView').getBoundingClientRect().top+8;
 return Math.max(0,items.findIndex(x=>x.el.getBoundingClientRect().bottom>top))}
function speakOnce(t){return new Promise(res=>{const u=new SpeechSynthesisUtterance(t),l=(cfg.src!=='Autodetect'?cfg.src:lastLang||'en').replace('_','-');
 u.lang=l;u.rate=RATES[rIdx];const v=pickVoice(l);if(v)u.voice=v;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
async function ttsRun(id){
 let first=true;
 while(tts&&tts.id===id){
  const items=ttsItems();if(!items.length)break;
  for(let i=first?firstVisible(items):0;i<items.length;i++){
   if(!tts||tts.id!==id)return;const it=items[i];
   if(it.el){it.el.classList.add('tts');if(cur.type!=='pdf')it.el.scrollIntoView({block:'center',behavior:'smooth'})}
   for(const c of chunk(it.text,280)){if(!tts||tts.id!==id)break;await speakOnce(c)}
   if(it.el)it.el.classList.remove('tts')}
  first=false;if(!tts||tts.id!==id)return;
  if(cur.type==='pdf'){if(pg>=pdf.numPages)break;pg++;await renderPdf()}
  else if(cur.type==='epub'){if(ci+1>=secs.length)break;await loadSec(ci+1)}else break;
  await sleep(250)}
 if(tts&&tts.id===id)ttsStop();
}
function ttsStop(){document.querySelectorAll('.tts').forEach(e=>e.classList.remove('tts'));tts=null;speechSynthesis.cancel();const b=$('#bTts');if(b)b.textContent='🎧'}

function swipeBind(el){
 let x0=null,y0=0;
 el.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;
  if(x0<28||x0>innerWidth-28)e.preventDefault()},{passive:false});   /* kənardan başlayan jest Safari-nin geri jestinə getməsin */
 el.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){hidePop();dx<0?next():prev()}},{passive:true});
}
