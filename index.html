<script>
const K='xerc-izleyici-v1';
const $=s=>document.querySelector(s);
const hapOn=()=>true;
// Android/Chrome: adi titrəyiş. iPhone: Safari bunu dəstəkləmir və iOS 26.5-dən skriptlə "switch" çevirmə yolu da bağlanıb;
// yalnız barmağın birbaşa toxunduğu həqiqi <input type=checkbox switch> sistem "tık"ı verir.
// Ona görə əsas düymələrin üstünə şəffaf həqiqi switch qoyulur: barmaq ona toxunur (tık), sonra düymənin öz əməli icra olunur.
function hap(kind){
  if(!hapOn())return;
  try{if(navigator.vibrate)navigator.vibrate(kind==='ok'?[12,50,12]:10)}catch(e){}
}
const HS='.fab,.tabs button,.seg button,button.btn,.pnav button,.chips button,.ops button';
let hsQ=0;
function decorate(){
  hsQ=0;
  if(navigator.vibrate||!hapOn())return;
  document.querySelectorAll(HS).forEach(h=>{
    if(h.hasAttribute('data-hs')||h.disabled)return;
    if((h.getAttribute('onclick')||'').startsWith('openOp('))return;
    h.setAttribute('data-hs','1');
    const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.className='hs';i.tabIndex=-1;i.setAttribute('aria-hidden','true');
    h.appendChild(i);
  });
}
function hsOff(){document.querySelectorAll('.hs').forEach(i=>{const h=i.parentElement;if(h)h.removeAttribute('data-hs');i.remove()})}
document.addEventListener('click',e=>{
  const t=e.target;
  if(!(t&&t.classList&&t.classList.contains('hs')))return;
  e.stopPropagation();
  const h=t.parentElement;
  setTimeout(()=>{if(h&&!h.disabled)h.click()},0);
},true);
let saveBad=false;
const warn=on=>{const e=document.getElementById('warn');if(e)e.hidden=!on};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));if(saveBad){saveBad=false;warn(0)}return true}catch(e){saveBad=true;warn(1);return false}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const r2=n=>Math.round(n*100)/100;
// mənfi işarəsi göstərilmir: qırmızı rəng = xərc/borc
const fmt=n=>r2(Math.abs(n)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g,' ')+' ₼';
const fmt0=n=>Math.round(Math.abs(n)).toLocaleString('en-US').replace(/,/g,' ')+' ₼';

    ||`<div class="empty">Hələ hesab yoxdur. Məsələn: Nağd, ABB debet kart, Kredit, Aylıq xərc.</div>`;

let DO=0;
const dayK=o=>{const n=new Date();return ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()+o))};
const firstDay=()=>S.tx.length?ymd(new Date(Math.min(...S.tx.map(t=>t.d)))):dayK(0);
// gün ofsetinin hüdudları: geri - ilk əməliyyatın günü, irəli - cari ayın son günü (növbəti aya keçmək olmaz)
const dOff=s=>Math.round((pdate(s)-pdate(dayK(0)))/864e5);
const dRange=()=>{const n=new Date();return[Math.min(0,dOff(firstDay())),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()-n.getDate()]};
function goD(o){
  const[mn,mx]=dRange();o=Math.max(mn,Math.min(mx,o));
  if(o===DO)return;
  const n=o>DO?1:-1;DO=o;hap('tick');
  const e=$('.daily');if(!e)return;
  e.outerHTML=dailyHtml();
  const c=$('.daily');if(c)c.classList.add(n>0?'dn':'dp');
}
const stepD=n=>goD(DO+n);
const pickD=v=>{if(v)goD(dOff(v))};
function dailyHtml(){
  const accs=S.acc.filter(a=>isB(a)||a.daily);
  if(!accs.length)return '';
  const[mn,mx]=dRange();DO=Math.max(mn,Math.min(mx,DO));
  const k=dayK(DO),[y,m,d]=k.split('-').map(Number),dl=new Date(y,m,0).getDate()-d+1,ds=dmy(new Date(y,m-1,d));
  const lbl=DO===0?'Bu gün':DO===-1?'Dünən':DO===1?'Sabah':ds;
  const when=DO<0?'həmin gün sonunda ':DO>0?'bu gün sonunda ':'';
  let h=`<div class="card daily"><h3>Gündəlik xərcləmə limiti</h3><div class="pnav" style="margin:8px 0 6px"><button onclick="stepD(-1)" ${DO<=mn?'disabled':''} aria-label="Əvvəlki gün">‹</button><b class="dpick" style="position:relative;text-align:center;line-height:1.25;cursor:pointer;flex:1;margin:0 10px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--field)">${lbl}<small style="display:block;font-weight:500;color:var(--mute);font-size:11px">${ds}</small><input type="date" value="${k}" min="${dayK(mn)}" max="${dayK(mx)}" onchange="pickD(this.value)" aria-label="Tarix seç" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0;cursor:pointer"></b><button onclick="stepD(1)" ${DO>=mx?'disabled':''} aria-label="Sonrakı gün">›</button></div>${DO?`<div style="text-align:center;margin:-2px 0 6px"><button onclick="goD(0)" style="background:none;border:0;color:var(--tint);font:600 12px inherit;padding:4px 8px">Bu günə qayıt</button></div>`:''}<p>${DO===0?'Bu gün':ds+' tarixi'} də daxil olmaqla ayın sonuna ${dl} gün qalıb${DO>1?'. Aralıqdakı günlərdə xərc etməsən':''}</p>`;
  accs.forEach(a=>{
    let bal=a.balance,spent=0;
    S.tx.forEach(t=>{const v=t.deltas&&t.deltas[a.id];if(v===undefined)return;const x=ymd(new Date(t.d));if(x>k)bal-=v;else if(x===k&&v<0&&txKind(t)==='spend')spent-=v});
    bal=r2(bal);spent=r2(spent);
    const ok=bal>0,L=Math.max(0,r2((bal+spent)/dl)),over=spent>L+0.004,left=r2(L-spent);
    const pct=L>0?Math.min(100,spent/L*100):(spent>0?100:0);
    const col=over?'var(--neg)':pct>=80?'#E08A00':'var(--pos)';
    h+=`<div class="drow"><span>${esc(a.name)}<br><small class="num" style="color:var(--mute)">${fmt(bal)} ${when}${ok?'qalıb':'(qalmayıb)'}</small></span><span class="v num ${L>0?'':'neg'}">${fmt(L)}<small> / gün</small></span></div>
    <div style="padding:0 0 10px"><div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px"><span class="num"><span style="color:var(--mute)">${lbl}:</span> <b>${fmt(spent)}</b> <span style="color:var(--mute)">/ ${fmt(L)}</span></span><span class="num" style="color:${over?'var(--neg)':'var(--mute)'}">${over?'limit aşılıb · +'+fmt(spent-L):fmt(left)+' qalıb'}</span></div><div class="bar" style="height:8px"><i style="width:${pct.toFixed(1)}%;min-width:0;background:${col}"></i></div></div>`;
  });
  return h+`</div>`;
}

function saveEdit(id){
  const d=readAcc();if(!d)return alert('Ad və məbləği düzgün yaz.');
  const acc=A(id),old=acc.name,ob=acc.balance;Object.assign(acc,d);
  // qalıq əl ilə dəyişdirilibsə, fərq əməliyyat kimi yazılır (artım → Əlavə, azalma → Xərc), "əl ilə" işarəsi ilə
  const df=r2(acc.balance-ob);
  if(df!==0){
    const up=df>0,nt='Qalıq redaktəsi';
    S.tx.unshift({id:uid(),d:Date.now(),label:nt+' · '+acc.name,sign:up?'+':'−',amt:Math.abs(df),deltas:{[id]:df},kind:up?'add':'spend',cat:up?undefined:'Digər',note:nt,manual:1});
    S.tx.sort((x,y)=>y.d-x.d);
  }
  if(old!==d.name)S.tx.forEach(t=>{if(t.deltas&&id in t.deltas){if(t.note===undefined&&txKind(t)!=='move')t.note=noteOf(t);t.label=mkLabel(t)}});

}
function delAcc(id){
  const a=A(id);if(!a)return;
  const nt=S.tx.filter(t=>t.deltas&&id in t.deltas).length,tp=S.tpls.filter(t=>t.acc===id).length,rl=S.rules.filter(r=>r.acc===id||r.to===id).length;
  const m=[`"${a.name}" hesabı silinsin?`];
  if(a.balance)m.push(`• ${a.balance<0?'Borcu':'Qalığı'} (${fmt(a.balance)}) artıq ümumi məbləğə daxil olmayacaq`);
  if(nt)m.push(`• ${nt} əməliyyat tarixçədə qalacaq, amma artıq bu hesaba bağlı olmayacaq`);
  if(tp)m.push(`• ${tp} şablon silinəcək`);
  if(rl)m.push(`• ${rl} avtomatik əməliyyat silinəcək`);
  if(!confirm(m.join('\n')))return;
  S.tpls=S.tpls.filter(t=>t.acc!==id);S.tpls.forEach(t=>{if(t.bud===id)t.bud=''});
  S.rules=S.rules.filter(r=>r.acc!==id&&r.to!==id);S.rules.forEach(r=>{if(r.bud===id)r.bud=''});
  ['from','to','bud'].forEach(k=>{if(S.last[k]===id)delete S.last[k]});
  S.acc=S.acc.filter(x=>x.id!==id);save();closeS();render();
}

// ---- Formada yadda saxlama: son hesab/kateqoriya/büdcə + qeydə görə kateqoriya
let NM=[];
const DEF={add:'Əlavə',spend:'Xərc'};
function noteOf(t){
  if(t.note!==undefined)return t.note;
  const k=txKind(t);if(k==='move')return '';
  const l=String(t.label),i=l.lastIndexOf(' · '),n=(i>0?l.slice(0,i):l).trim();
  return n===DEF[k]?'':n;
}
function mkLabel(t){
  const k=txKind(t),p=txParts(t),nm=id=>A(id).name;
  if(k==='move')return p.from&&p.to?`${noteOf(t)||'Transfer'} · ${nm(p.from)} → ${nm(p.to)}`:t.label;
  const note=noteOf(t);
  if(k==='add')return p.to?`${note||'Əlavə'} · ${nm(p.to)}`:t.label;
  return p.from?`${note||'Xərc'} · ${nm(p.from)}${p.bud?' → '+nm(p.bud):''}`:t.label;
}
function buildNotes(){
  const seen=new Set();NM=[];
  [...S.tx].sort((a,b)=>b.d-a.d).forEach(t=>{
    if(txKind(t)!=='spend')return;
    const raw=noteOf(t),n=fold(raw).trim();
    if(!n||raw==='Xərc'||seen.has(n))return;
    seen.add(n);NM.push({n,raw,cat:catOf(t)});
  });
}
function noteCat(v){
  const q=fold(v).trim();if(!q)return null;
  let m=NM.find(x=>x.n===q);if(!m&&q.length>=3)m=NM.find(x=>x.n.startsWith(q));
  return m?m.cat:null;
}

  if(kind==='move'){

    <div class="note">Göndərən hesabda pul azdırsa, çatmayan hissə qırmızı qalıq kimi görünür. Kreditə ödəniş üçün də transferdən istifadə et.</div>`;}
  h+=`<label>Tarix</label><input id="f-date" type="date" value="${dr.date||ymd(new Date())}" max="${ymd(new Date())}"><button class="btn" onclick="doOp('${kind}')">Təsdiq et</button>`;

  const fa=$('#f-amt');if(fa&&!dr.amt)fa.focus({preventScroll:true});

function post(label,sign,amt,deltas,x={}){
  for(const id in deltas){const a=A(id);if(a)a.balance=r2(a.balance+deltas[id])}
  const tx={id:uid(),d:x.d||Date.now(),label,sign,amt,deltas,kind:x.kind,cat:x.cat,auto:x.auto,rid:x.rid,note:x.note};S.tx.unshift(tx);
  if(!x.quiet){S.tx.sort((p,q)=>q.d-p.d);save();closeS();render();hap('ok')}
  return tx;
}
function doOp(kind){
  const amt=num($('#f-amt').value);
  if(amt===null||amt<=0)return alert('Məbləği düzgün yaz.');
  if($('#f-date').value>ymd(new Date()))return alert('Gələcək tarixə əməliyyat yazmaq olmaz.');
  const note=$('#f-note')?$('#f-note').value.trim():'',D=dateTs($('#f-date').value);
  if(kind==='add'){const a=A($('#f-to').value);S.last={...S.last,to:a.id};post(`${note||'Əlavə'} · ${a.name}`,'+',amt,{[a.id]:amt},{kind:'add',d:D,note})}
  if(kind==='spend'){
    const a=A($('#f-from').value),c=$('#f-cat').value?A($('#f-cat').value):null;
    const d={[a.id]:-amt};if(c)d[c.id]=-amt;
    S.last={...S.last,from:a.id,cat:$('#f-catg').value,bud:c?c.id:''};
    if($('#f-tpl')&&$('#f-tpl').checked)S.tpls.push({id:uid(),name:note||$('#f-catg').value,amt,cat:$('#f-catg').value,acc:a.id,bud:c?c.id:''});
    post(`${note||'Xərc'} · ${a.name}${c?' → '+c.name:''}`,'−',amt,d,{kind:'spend',cat:$('#f-catg').value,d:D,note});
  }
  if(kind==='move'){
    const f=A($('#f-from').value),t=A($('#f-to').value);
    if(f.id===t.id)return alert('Fərqli hesablar seç.');
    post(`${note||'Transfer'} · ${f.name} → ${t.name}`,'',amt,{[f.id]:-amt,[t.id]:amt},{kind:'move',d:D,note});
  }
}
const dateTs=v=>{if(!v||v===ymd(new Date()))return Date.now();const[y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,12).getTime()};
function txParts(t){
  const ids=Object.keys(t.deltas).filter(k=>A(k)),k=txKind(t);
  if(k==='add')return{to:ids[0]};
  if(k==='spend')return{from:ids.find(i=>!isB(A(i))),bud:ids.find(i=>isB(A(i)))};
  return{from:ids.find(i=>t.deltas[i]<0),to:ids.find(i=>t.deltas[i]>0)};
}
function openTxEdit(id,nk,dr){
  const t=S.tx.find(x=>x.id===id),ok=txKind(t),k=nk||ok,p=txParts(t);
  const R=S.acc.filter(a=>!isB(a)),B=S.acc.filter(isB);
  const gone=Object.keys(t.deltas).some(x=>!A(x)),mx=ymd(new Date(Math.max(Date.now(),t.d)));
  const D=dr||{note:noteOf(t),amt:t.amt,date:ymd(new Date(t.d))};
  const inR=i=>R.some(a=>a.id===i)?i:(R[0]||{}).id,first=ex=>(R.find(a=>a.id!==ex)||R[0]||{}).id;
  let P={};
  if(k==='add')P={to:ok==='spend'?p.from:p.to};
  else if(k==='spend')P={from:inR(ok==='add'?p.to:p.from),bud:ok==='spend'?p.bud:'',cat:ok==='spend'?catOf(t):(S.cats.includes(S.last.cat)?S.last.cat:S.cats[0])};
  else if(ok==='move')P={from:p.from,to:p.to};
  else if(ok==='spend'){const f=inR(p.from);P={from:f,to:first(f)}}
  else{const to=inR(p.to);P={from:first(to),to}}
  const T=[['spend','Xərc'],['add','Əlavə et'],['move','Transfer']];
  let h=`<h3>Əməliyyatı redaktə et</h3><div class="tabs">${T.map(x=>`<button class="${x[0]===k?'on':''}" onclick="txKind2('${id}','${x[0]}')">${x[1]}</button>`).join('')}</div>
  <input type="hidden" id="e-kind" value="${k}">
  <label>Qeyd (istəyə bağlı)</label><input id="e-label" value="${esc(D.note)}">
  <label>Məbləğ</label>${amtF('e-amt',D.amt)}`;
  if(k==='add')h+=`<label>Hesab</label><select id="e-to">${opts(S.acc,P.to)}</select>`;
  if(k==='spend')h+=`<label>Hansı hesabdan</label><select id="e-from">${opts(R,P.from)}</select>
    <label>Kateqoriya</label><select id="e-cat">${S.cats.map(c=>`<option ${c===P.cat?'selected':''}>${c}</option>`).join('')}</select>
    <label>Xərc büdcəsindən də çıx</label><select id="e-bud"><option value="">Yox</option>${opts(B,P.bud)}</select>`;
  if(k==='move')h+=`<label>Haradan</label><select id="e-from">${opts(R,P.from)}</select><label>Hara</label><select id="e-to">${opts(R,P.to)}</select>`;
  h+=`<label>Tarix</label><input id="e-date" type="date" value="${D.date}" max="${mx}">
  <div class="note">Dəyişikliklər hesablara avtomatik tətbiq olunur.${gone?' Bu əməliyyatın hesabı silinib: yadda saxlasan, seçdiyin hesaba tətbiq olunacaq.':''}</div>
  <button class="btn" onclick="saveTx('${id}')">Yadda saxla</button><button class="btn alt" onclick="delTx('${id}')">Sil</button>`;
  openS(h);
}
// əməliyyatın növünü dəyiş (Xərc / Əlavə / Transfer): yazılmış qeyd, məbləğ və tarix qalır
function txKind2(id,k){
  const R=S.acc.filter(a=>!isB(a));
  if(k==='move'&&R.length<2)return alert('Transfer üçün ən azı iki pul hesabı lazımdır (büdcə hesabları transferdə iştirak etmir).');
  if(k==='spend'&&!R.length)return alert('Xərc üçün pul hesabı lazımdır.');
  openTxEdit(id,k,{note:$('#e-label').value,amt:$('#e-amt').value,date:$('#e-date').value});
}
function saveTx(id){
  const t=S.tx.find(x=>x.id===id),g=x=>$(x)?$(x).value:'',k=g('#e-kind')||txKind(t),amt=num($('#e-amt').value);
  if(amt===null||amt<=0)return alert('Məbləği düzgün yaz.');
  const dv=g('#e-date');
  if(dv&&dv!==ymd(new Date(t.d))&&dv>ymd(new Date()))return alert('Gələcək tarix seçmək olmaz.');
  let nd;
  if(k==='add')nd={[g('#e-to')]:amt};
  else if(k==='spend'){nd={[g('#e-from')]:-amt};if(g('#e-bud'))nd[g('#e-bud')]=-amt}
  else{if(g('#e-from')===g('#e-to'))return alert('Fərqli hesablar seç.');nd={[g('#e-from')]:-amt,[g('#e-to')]:amt}}
  for(const x in t.deltas){const a=A(x);if(a)a.balance=r2(a.balance-t.deltas[x])}
  for(const x in nd){const a=A(x);if(a)a.balance=r2(a.balance+nd[x])}
  t.deltas=nd;t.amt=r2(amt);
  if(k!==txKind(t)){t.kind=k;t.sign=k==='add'?'+':k==='spend'?'−':'';delete t.auto;delete t.rid}
  t.note=g('#e-label').trim();
  if(k==='spend')t.cat=g('#e-cat');else delete t.cat;
  if(dv&&dv!==ymd(new Date(t.d)))t.d=dateTs(dv);
  t.label=mkLabel(t);
  S.tx.sort((x,y)=>y.d-x.d);save();closeS();render();hap('ok');
}
function delTx(id){
  if(!confirm('Əməliyyat silinsin və hesablar geri qaytarılsın?'))return;
  rmTx(id);hap('tick');
}
function rmTx(id){
  const t=S.tx.find(x=>x.id===id);if(!t)return;
  for(const k in t.deltas){const a=A(k);if(a)a.balance=r2(a.balance-t.deltas[k])}
  S.tx=S.tx.filter(x=>x.id!==id);save();closeS();render();
}

function exportD(){
  const j=JSON.stringify(S);
  (navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Nüsxə kopyalandı. Qeydlər və ya mesajlar tətbiqində saxla.')).catch(()=>prompt('Bu mətni kopyala və saxla:',j));
}
function importD(){
  const j=prompt('Əvvəl aldığın nüsxəni bura yapışdır (cari data əvəz olunacaq):');
  if(!j)return;
  try{const d=JSON.parse(j);if(!Array.isArray(d.acc)||!Array.isArray(d.tx))throw 0;S=norm(d);save();render()}catch(e){alert('Nüsxə oxunmadı.')}
}

// ---- Sürüşdürmə jestləri
// 1) səhifələr arası: sola → növbəti, sağa → əvvəlki (Ana səhifə · Əməliyyatlar · Statistika · ⚙︎)
// 2) Statistikada diaqram sahəsində: sağa → əvvəlki dövr, sola → növbəti dövr
(function(){
  // Tablar arası swipe ləğv edildi. İndi: ekranın sol kənarından sağa çəkmək = geri (iPhone kimi).
  let x0=0,y0=0,t0=0,tg=null,mode=0,pop0=0;
  addEventListener('touchstart',e=>{
    const t=e.touches[0];mode=0;x0=t.clientX;y0=t.clientY;t0=Date.now();tg=e.target;pop0=popAt;
    if(e.touches.length!==1)return;
    if($('#sheet').hidden&&!e.target.closest('input:not(.hs),select,textarea'))mode=1;
  },{passive:true});
  // kənardan başlayan üfüqi çəkmədə iPhone-un öz geri jestini söndürməyə cəhd
  addEventListener('touchmove',e=>{
    if(mode!==1||e.touches.length!==1||!e.cancelable)return;
    const t=e.touches[0],W=innerWidth;
    if((x0<=30||x0>=W-30)&&Math.abs(t.clientX-x0)>Math.abs(t.clientY-y0))e.preventDefault();
  },{passive:false});
  addEventListener('touchend',e=>{
    if(!mode)return;const m=mode;mode=0;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    if(m===2)return;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-t0>700)return;
    if(view==='stat'&&tg.closest&&tg.closest('[data-sw="p"]')){stepP(dx<0?1:-1);return}
    if(view==='home'&&tg.closest&&tg.closest('.daily')){stepD(dx<0?1:-1);return}
    if(tg.closest&&!tg.closest('.sw .swc,[data-sw="p"]')&&![...document.querySelectorAll('.sw .swc')].some(r=>r.style.transform)){
      let el=tg,scr=false;while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+2&&/(auto|scroll)/.test(getComputedStyle(el).overflowX)){scr=true;break}el=el.parentElement}
      const i=VW.indexOf(view),n=dx<0?i+1:i-1;
      if(!scr&&i>=0&&n>=0&&n<VW.length){hap('tick');setView(VW[n])}
    }
  },{passive:true});
  // alt pəncərəni (sheet) aşağı çəkib bağlamaq
  const b=$('#box');let sy=0,sx=0,dy=0,ok=false;
  b.addEventListener('touchstart',e=>{const t=e.touches[0];ok=b.scrollTop<=0&&e.touches.length===1&&!e.target.closest('input:not(.hs),select,textarea');sy=t.clientY;sx=t.clientX;dy=0;b.style.transition='none'},{passive:true});
  b.addEventListener('touchmove',e=>{if(!ok)return;const t=e.touches[0];dy=t.clientY-sy;if(dy>12&&dy>Math.abs(t.clientX-sx))b.style.transform='translateY('+dy+'px)';else b.style.transform=''},{passive:true});
  b.addEventListener('touchend',()=>{if(!ok)return;ok=false;const c=dy>110;b.style.transition='transform .18s';b.style.transform='';if(c){if(typing())document.activeElement.blur();else{closeS();hap('tick')}}setTimeout(()=>{b.style.transition=''},200)},{passive:true});
})();


// ---- Sola çəkib silmək (iPhone Mail kimi)
let swMoved=0;
const swW=(row,del,edit)=>`<div class="sw${edit?' sw2':''}"${edit?' data-w="168"':''}>${edit?`<button class="swed" aria-label="Redaktə" onclick="swDelX(()=>${edit})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`:''}<button class="swdel" aria-label="Sil" onclick="swDelX(()=>${del})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></button>${row.replace('class="acc"','class="acc swc"')}</div>`;
function swDelX(f){hap('tick');f();swClose()}
document.addEventListener('click',e=>{
  const r=e.target.closest&&e.target.closest('.sw .swc');if(!r)return;
  const open=[...document.querySelectorAll('.sw .swc')].some(x=>x.style.transform);
  if(open||Date.now()-swMoved<350){e.stopPropagation();e.preventDefault();if(open)swClose()}
},true);

function swX(r,v){r.style.transform=v?'translateX('+v+'px)':'';r.parentNode.style.setProperty('--tx',(v||0)+'px')}
function swHide(r){setTimeout(()=>{if(!r.style.transform&&r.parentNode)r.parentNode.classList.remove('act')},260)}
function swClose(except){document.querySelectorAll('.sw .swc').forEach(r=>{if(r!==except&&r.style.transform){r.classList.remove('drag');r.parentNode.classList.remove('dr');swX(r,0);swHide(r)}})}
function swTap(id){
  if(Date.now()-swMoved<350)return;
  if([...document.querySelectorAll('.sw .swc')].some(r=>r.style.transform)){swClose();return}
  openTxEdit(id);
}
function swDel(id){
  const r=document.querySelector('.sw .swc[data-id="'+id+'"]'),w=r&&r.parentNode;
  hap('tick');
  if(w){w.style.maxHeight=w.offsetHeight+'px';void w.offsetWidth;w.classList.add('gone');setTimeout(()=>rmTx(id),230)}else rmTx(id);
}
(function(){
  let W=84;let row=null,x0=0,y0=0,base=0,dx=0,drag=false,dec=false;
  document.addEventListener('touchstart',e=>{
    const r=e.target.closest&&e.target.closest('.sw .swc');
    if(!r||e.touches.length!==1||e.touches[0].clientX<=28){row=null;if(!r&&!(e.target.closest&&e.target.closest('.swdel,.swed')))swClose();return}
    swClose(r);row=r;W=+(r.parentNode.dataset.w)||84;const t=e.touches[0];x0=t.clientX;y0=t.clientY;base=r.style.transform?-W:0;dx=0;drag=false;dec=false;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!row)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
    if(!dec){if(Math.abs(mx)<8&&Math.abs(my)<8)return;dec=true;drag=Math.abs(mx)>Math.abs(my);if(drag){row.classList.add('drag');row.parentNode.classList.add('act','dr')}}
    if(!drag)return;
    let v=base+mx;if(v>0)v=0;if(v<-W)v=-W-Math.sqrt(-W-v)*3;
    dx=v;swX(row,v);
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(!row)return;const r=row;row=null;
    if(!drag)return;swMoved=Date.now();r.classList.remove('drag');r.parentNode.classList.remove('dr');
    if(dx<-W/2){swX(r,-W);hap('tick')}else{swX(r,0);swHide(r)}
  },{passive:true});
  document.addEventListener('touchcancel',()=>{if(row){const r=row;r.classList.remove('drag');r.parentNode.classList.remove('dr');swX(r,0);swHide(r);row=null}},{passive:true});
})();

try{localStorage.removeItem('xerc-lock')}catch(e){}


['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});
let popAt=0;
document.addEventListener('touchstart',()=>{},{passive:true});
try{new MutationObserver(()=>{if(!hsQ){hsQ=1;requestAnimationFrame(decorate)}}).observe(document.body,{childList:true,subtree:true})}catch(e){}
applyTheme();decorate();
runRules();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&runRules())render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
