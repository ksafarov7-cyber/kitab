 return `<div class="ph" style="background:linear-gradient(150deg,hsl(${h},42%,40%),hsl(${(h+40)%360},48%,22%))"><b>${esc(b.name.trim().charAt(0).toUpperCase()||'?')}</b><small>${b.type.toUpperCase()}</small></div>`}
async function makeCover(b){
 const W=160,cv=document.createElement('canvas');
 if(b.type==='pdf'){const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise,pg1=await d.getPage(1),v0=pg1.getViewport({scale:1}),vp=pg1.getViewport({scale:W/v0.width});
  cv.width=vp.width;cv.height=vp.height;await pg1.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;try{d.destroy()}catch{}return cv.toDataURL('image/jpeg',.7)}
 if(b.type==='epub'){await needEpub();const bk=ePub(await b.blob.arrayBuffer(),{openAs:'binary'});await bk.ready;
  const u=await bk.coverUrl();if(!u){try{bk.destroy()}catch{}return null}
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
  cv.width=W;cv.height=Math.round(img.naturalHeight*W/img.naturalWidth);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);try{bk.destroy()}catch{}return cv.toDataURL('image/jpeg',.7)}
 return null}

 if(b.type==='pdf'){const d=await pdfjsLib.getDocument({data:await b.blob.arrayBuffer()}).promise;
  for(let i=1;i<=d.numPages&&!job.stop;i++){const t=await(await d.getPage(i)).getTextContent();add(t.items.map(x=>x.str).join(' '));prog(i+'/'+d.numPages)}return}
 await needEpub();const bk=ePub(await b.blob.arrayBuffer(),{openAs:'binary'});await bk.ready;let i=0;
 for(const sc of bk.spine.spineItems){if(job.stop)break;
  try{const c=await sc.load(bk.load.bind(bk));c.querySelectorAll('style,script').forEach(e=>e.remove());add(c.textContent||'');sc.unload&&sc.unload()}catch{}
  prog(++i+'/'+bk.spine.spineItems.length)}

}
async function trBatch(ws,src,dst){
 const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+(src==='Autodetect'?'auto':src)+'&tl='+dst+'&q='+encodeURIComponent(ws.join('\n')));
 if(!r.ok)throw new Error('HTTP '+r.status);
 const j=await r.json(),T=(j[0]||[]).map(x=>x[0]).join('').split('\n').map(x=>x.trim());
 while(T.length&&!T[T.length-1])T.pop();
 if(T.length!==ws.length){
  if(ws.length===1)return T[0]?{[ws[0]]:T[0]}:{};
  const h=ws.length>>1;return Object.assign(await trBatch(ws.slice(0,h),src,dst),await trBatch(ws.slice(h),src,dst))}
 const o={};ws.forEach((w,i)=>{if(T[i])o[w]=T[i]});return o;
}
async function makePack(b){
 if(job)return;const src=cfg.src,dst=cfg.dst;
 if(src===dst){alert('Mənbə və tərcümə dili eyni ola bilməz (⚙).');return}
 job={id:b.id,txt:'Mətn oxunur…',stop:false};renderLib();
 let fail=null;
 try{
  const cnt=new Map();
  await readBook(b,t=>{for(const m of t.matchAll(WRE)){const w=m[0].toLowerCase();if(w.length>1&&w.length<31)cnt.set(w,(cnt.get(w)||0)+1)}},x=>{job.txt='Mətn oxunur… '+x;upd()});
  const words=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,15000),batches=[];
  for(let i=0;i<words.length;){let n=0,len=0;while(i+n<words.length&&n<250&&len+words[i+n].length+1<1300){len+=words[i+n].length+1;n++}batches.push(words.slice(i,i+n));i+=n}
  const map={};let bi=0,done=0;
  const worker=async()=>{while(bi<batches.length&&!job.stop&&!fail){const bt=batches[bi++];
   try{Object.assign(map,await trBatch(bt,src,dst))}catch(e){fail=e}
   done+=bt.length;job.txt='Tərcümə olunur… '+Math.round(done/words.length*100)+'% ('+Object.keys(map).length+' söz)';upd()}};
  await Promise.all([worker(),worker(),worker()]);
  const n=Object.keys(map).length;
  if(n){const p={id:b.id,name:b.name,src,dst,n,date:Date.now(),map,partial:!!(fail||job.stop)};await tx('readwrite',x=>x.put(p),'packs');packIdx[b.id]=p}
  else if(fail)alert('Alınmadı. İnternet bağlantısını yoxla və yenidən cəhd et.');
 }catch(e){alert('Xəta: '+(e.message||e))}
 job=null;renderLib();
}

function build(unit,pdf){

 if(pdf){
  const items=[...unit.children].filter(e=>e.firstChild&&e.firstChild.nodeType===3).map(e=>({e,b:e.getBoundingClientRect()})),lines=[];
  for(const o of items){const cy=(o.b.top+o.b.bottom)/2,L=lines.find(l=>Math.abs(cy-l.cy)<Math.max(o.b.height,l.h)*.45);
   if(L)L.it.push(o);else lines.push({cy,h:o.b.height,it:[o]})}
  for(const L of lines){L.it.sort((a,b)=>a.b.left-b.b.left);if(text&&!/\s$/.test(text))text+=' ';let prev=null;
   for(const o of L.it){const t=o.e.textContent;
    if(prev&&o.b.left-prev.b.right>L.h*.2&&!/\s$/.test(text)&&!/^\s/.test(t))text+=' ';
    segs.push({node:o.e.firstChild,start:text.length,len:t.length});text+=t;prev=o}}
 }else{
  const walk=n=>{for(const c of n.childNodes){
   if(c.nodeType===3){segs.push({node:c,start:text.length,len:c.data.length});text+=c.data}
   else if(c.nodeType===1){if(c.tagName==='BR'){text+=' ';continue}const d=cs(c);if(d.startsWith('inline')||d==='contents')walk(c)}}};
  walk(unit);

   $('#qf').innerHTML=`<div class="fbk ${correct?'ok':'bad'}">${correct?'<b>Düzdür ✓</b>':'<b>Səhv ✗</b> Düzgün cavab: <b>'+esc(Q.right)+'</b>'}<div style="margin-top:8px">${Q.info}</div></div><button class="fill" id="qn" style="width:100%;padding:12px">Növbəti</button>`;
   $('#qn').onclick=()=>{correct?q.shift():q.push(q.shift());step()};$('#qn').focus();
  };
  const box=$('#qo');
  if(Q.opts){Q.opts.forEach((t,i)=>{const b=el('button','opt',`<b>${'ABCD'[i]}</b>&nbsp; ${esc(t)}`);b.dataset.t=t;
   b.onclick=()=>{[...box.children].forEach(z=>z.disabled=true);const c=t===Q.right;b.classList.add(c?'ok':'bad');if(!c)[...box.children].forEach(z=>{if(z.dataset.t===Q.right)z.classList.add('ok')});fin(c)};box.append(b)})}
  else{box.innerHTML=`<div class="mu" style="margin-bottom:8px">${esc(Q.hint)}</div><input class="qin" id="qi" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Yaz…"><div style="display:flex;gap:8px;margin-top:10px"><button class="fill" id="qy">Yoxla</button><button id="qk2">Bilmirəm</button></div>`;
   const chk=g=>{if($('#qy').disabled)return;['#qy','#qk2','#qi'].forEach(s=>$(s).disabled=true);const c=!!g&&norm(g)===norm(Q.right);$('#qi').classList.add(c?'ok':'bad');fin(c)};
   $('#qy').onclick=()=>chk($('#qi').value.trim());$('#qk2').onclick=()=>chk('');$('#qi').onkeydown=e=>{if(e.key==='Enter')chk($('#qi').value.trim())};$('#qi').focus()}
 };
 const end=()=>{
  d.innerHTML=`<div class="fc"><div class="fw">${Math.round(ok/total*100)}%</div><p>${ok} / ${total} ilk cəhddə düzgün · ən uzun seriya: ${best}</p>${wrong.length?'<h4 class="mu">Səhv etdiyin sözlər</h4>'+wrong.map(w=>`<div class="wr"><b>${esc(w.w)}</b> — <small class="mu">${esc(w.defs&&w.defs[0]?w.defs[0].d:w.t||'')}</small></div>`).join(''):'<p>Hamısı düzgün! 🎉</p>'}<div class="fb"><button class="fill" id="a1">Yenidən</button><button id="a2">Lüğətə qayıt</button></div></div>`;
  $('#a1').onclick=()=>startQuiz(o);$('#a2').onclick=renderDict;count();
 };
 step();
}

 const q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';
 const csv=dict.map(x=>[x.w,(x.defs&&x.defs[0]?x.defs[0].d:''),x.t,x.ctx,x.book].map(q).join(',')).join('\n');

/* ---------- settings ---------- */
const fill=(el,skipAuto,val)=>{el.innerHTML=LANGS.filter(l=>!(skipAuto&&l[0]==='Autodetect')).map(l=>`<option value="${l[0]}"${l[0]===val?' selected':''}>${l[1]}</option>`).join('')};

 $('#sFont').innerHTML=Object.keys(FN).map(k=>`<option value="${k}"${k===cfg.font?' selected':''}>${FN[k]}</option>`).join('');

['#pdfView','#txtView'].forEach(q=>$(q).addEventListener('scroll',hidePop));
bind($('#pdfView'),document,null,true);bind($('#txtView'),document,null,false);bind($('#epubView'),document,null,false);
/* ---------- Ucadan oxu (player) ---------- */
const RATES=[1,1.25,1.5,.8],sleep=ms=>new Promise(r=>setTimeout(r,ms));let tts=null,rIdx=0;
function ttsItems(){
 if(cur.type==='pdf'){const l=document.querySelector('#pdfView .textLayer');if(!l)return[];const t=build(l,true).text.replace(/\s+/g,' ').trim();return t?[{text:t}]:[]}
 const root=cur.type==='epub'?document.querySelector('.ebody'):$('#txtView');if(!root)return[];
 let els=[...root.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre')].filter(e=>!e.querySelector('p,li,h1,h2,h3,h4,h5,h6,blockquote,pre'));
 if(!els.length)els=[root];
 return els.map(el=>({el,text:el.textContent.replace(/\s+/g,' ').trim()})).filter(x=>x.text.length>1)}
function firstVisible(items){if(cur.type==='pdf')return 0;const top=$(cur.type==='epub'?'#epubView':'#txtView').getBoundingClientRect().top+8;
 return Math.max(0,items.findIndex(x=>x.el.getBoundingClientRect().bottom>top))}
function speakOnce(t){return new Promise(res=>{const u=new SpeechSynthesisUtterance(t),l=(cfg.src!=='Autodetect'?cfg.src:lastLang||'en').replace('_','-');
 u.lang=l;u.rate=RATES[rIdx];const v=pickVoice(l);if(v)u.voice=v;u.onend=u.onerror=()=>res();speechSynthesis.speak(u)})}
async function ttsRun(id){
 let first=true;
 while(tts&&tts.id===id){
  const items=ttsItems();if(!items.length)break;
  for(let i=first?firstVisible(items):0;i<items.length;i++){
   if(!tts||tts.id!==id)return;const it=items[i];
   if(it.el){it.el.classList.add('tts');if(cur.type!=='pdf')it.el.scrollIntoView({block:'center',behavior:'smooth'})}
   for(const c of chunk(it.text,280)){if(!tts||tts.id!==id)break;await speakOnce(c)}
   if(it.el)it.el.classList.remove('tts')}
  first=false;if(!tts||tts.id!==id)return;
  if(cur.type==='pdf'){if(pg>=pdf.numPages)break;pg++;await renderPdf()}
  else if(cur.type==='epub'){if(ci+1>=secs.length)break;await loadSec(ci+1)}else break;
  await sleep(250)}
 if(tts&&tts.id===id)ttsStop();
}
function ttsStop(){document.querySelectorAll('.tts').forEach(e=>e.classList.remove('tts'));tts=null;speechSynthesis.cancel();const b=$('#bTts');if(b)b.textContent='🎧'}
$('#bTts').onclick=()=>{if(!cur)return;if(tts){ttsStop();return}hidePop();tts={id:Date.now()};$('#bTts').textContent='■';ttsRun(tts.id)};
$('#bRate').onclick=()=>{rIdx=(rIdx+1)%RATES.length;$('#bRate').textContent=RATES[rIdx]+'×'};

document.addEventListener('scroll',()=>lastAct=Date.now(),true);
setInterval(()=>{if(!cur||$('#reader').hidden||document.hidden)return;if(Date.now()-lastAct>90000&&!tts)return;
 const k='time:'+cur.id;SV(k,LS(k,0)+5);SV(today(),LS(today(),0)+5)},5000);
/* ---------- swipe ilə vərəq çevirmə ---------- */
function swipeBind(el){
 let x0=null,y0=0;
 el.addEventListener('touchstart',e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;
  if(x0<28||x0>innerWidth-28)e.preventDefault()},{passive:false});   /* kənardan başlayan jest Safari-nin geri jestinə getməsin */
 el.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){hidePop();dx<0?next():prev()}},{passive:true});
}
['#epubView','#pdfView','#txtView'].forEach(q=>swipeBind($(q)));
history.pushState({o:1},'');addEventListener('popstate',()=>history.pushState({o:1},''));   /* geri swipe səhifədən çıxarmasın */

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
